<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Just Do it 통계 섬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Caveat:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --ink:#4a3b2a;--paper:#fff8e8;--paper-2:#fdf0cf;--line:#e8d6a8;--leaf:#6cbf6a;--leaf-deep:#3f9a55;--sky:#bfe8f5;
  --btn:#ffcf5a;--btn-ink:#4a3b2a;--blue:#2a63d4;--shadow:0 6px 0 rgba(120,90,40,.18),0 12px 28px rgba(80,60,20,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#fff3dc;--paper:#3a3349;--paper-2:#463e57;--line:#5b5170;--sky:#2b3557;--btn:#f3c64f;--btn-ink:#2b2433;--blue:#8fb8ff;}}
:root[data-theme="dark"]{--ink:#fff3dc;--paper:#3a3349;--paper-2:#463e57;--line:#5b5170;--sky:#2b3557;--btn:#f3c64f;--btn-ink:#2b2433;--blue:#8fb8ff;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;height:100dvh;width:100%;overflow:hidden;background:var(--sky);font-family:Jua,"Noto Sans KR",system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
#game{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none}
.hud{position:fixed;z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}
.card{background:var(--paper);border:3px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
#title{top:14px;left:14px;padding:10px 16px;max-width:min(360px,calc(100vw - 28px))}
#title h1{margin:0;font-family:Caveat,Jua,cursive;font-size:30px;line-height:1;font-weight:700}
#title h1 b{color:var(--blue);font-size:1.25em}
#title p{margin:6px 0 0;font-size:13.5px;opacity:.85;line-height:1.45}
#top-right{top:14px;right:14px;display:flex;gap:8px}
.btn{font:inherit;border:3px solid rgba(0,0,0,.08);background:var(--btn);color:var(--btn-ink);border-radius:999px;padding:9px 16px;font-size:15px;cursor:pointer;box-shadow:0 4px 0 rgba(120,90,40,.25);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(120,90,40,.25)}
.btn.ghost{background:var(--paper)}
#map{bottom:16px;right:16px;padding:6px;border-radius:50%}
#zoom{right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;padding:6px;gap:4px;border-radius:999px}
#zoom button{font:inherit;font-size:24px;line-height:1;width:44px;height:44px;border-radius:50%;border:none;background:var(--btn);color:var(--btn-ink);cursor:pointer;box-shadow:0 3px 0 rgba(120,90,40,.25)}
#zoom button:active{transform:translateY(2px);box-shadow:none}
#zoom span{font-size:12px;opacity:.8}
#map canvas{display:block;border-radius:50%;width:132px;height:132px}
#prompt{left:50%;bottom:34px;transform:translateX(-50%);padding:12px 22px;font-size:19px;display:none;cursor:pointer;white-space:nowrap;animation:bob 1.4s ease-in-out infinite}
#prompt kbd{font-family:inherit;background:var(--btn);border-radius:8px;padding:1px 8px;margin-left:6px;font-size:15px}
@keyframes bob{50%{transform:translateX(-50%) translateY(-5px)}}
#joy{left:22px;bottom:22px;width:128px;height:128px;border-radius:50%;background:rgba(255,248,232,.55);border:3px solid rgba(232,214,168,.9);display:none;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--btn);box-shadow:0 4px 0 rgba(120,90,40,.25)}
@media (max-width:560px),(max-height:500px){#title{max-width:calc(100vw - 130px);padding:6px 12px;top:10px;left:10px;border-width:2px;border-radius:16px}#title h1{font-size:19px}#title p{display:none}
  #top-right{top:10px;right:10px}.btn{padding:6px 12px;font-size:13px;border-width:2px}
  #prompt{font-size:15px;padding:9px 16px;bottom:150px;border-width:2px}#prompt kbd{display:none}
  #room{padding:10px}#room .card{padding:14px 14px 12px;border-radius:18px}#room .room-head .badge{width:44px;height:44px;font-size:22px;border-radius:14px}#room .room-head h2{font-size:20px}#room .room-head small{font-size:12.5px}
  #room .talk{font-size:14px;padding:10px 12px;margin:12px 0 10px}#room .opts{font-size:13.5px}#room #room-hint{display:none}
  #room .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}#room .item{padding:9px 10px;border-width:2px;border-radius:14px;gap:8px}#room .item .no{width:24px;height:24px;font-size:12px}#room .item b{font-size:14.5px}#room .item small{font-size:11.5px}
  #room .room-foot .btn{flex:1;justify-content:center}}
@media (max-width:560px),(max-height:500px){#zoom{right:10px;top:auto;bottom:118px;transform:none;flex-direction:column}#zoom button{width:38px;height:38px;font-size:21px}}
@media (max-width:560px),(max-height:500px){#score{top:52px;right:10px;font-size:13px;padding:4px 10px;border-width:2px}#chat{padding:10px}#chat .card{padding:14px}#chat .grid{grid-template-columns:1fr}}
@media (pointer:coarse){#joy{display:block;width:108px;height:108px;left:16px;bottom:16px}#joy i{width:44px;height:44px;margin:-22px 0 0 -22px}#map{right:10px;bottom:12px;padding:4px}#map canvas{width:84px;height:84px}#title p.keys{display:none}}
/* 건물 안 */
#chat{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(60,45,25,.35);padding:16px}
#chat.open{display:flex}
#chat .card{width:min(720px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px 22px 18px;animation:pop .25s ease-out}
#chat .item.ok{border-color:#3f9a55;background:#e3f6df}#chat .item.no{border-color:#e0897f;opacity:.75}
#chat .item[disabled]{cursor:default;transform:none}
#score{top:66px;right:14px;padding:6px 14px;font-size:15px;border-radius:999px}
#room{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(60,45,25,.35);padding:16px}
#room.open{display:flex}
#room .card{width:min(860px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px 22px 18px;background:var(--paper);animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.room-head{display:flex;align-items:center;gap:14px}
.room-head .badge{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:30px;flex:none}
.room-head h2{margin:0;font-size:26px;font-weight:400}
.room-head small{display:block;opacity:.75;font-size:14px;margin-top:2px}
.talk{margin:16px 0 14px;padding:12px 16px;border-radius:18px;background:var(--paper-2);font-size:16px;position:relative}
.talk b{font-weight:400;color:var(--leaf-deep)}
.opts{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:15px}
.opts label{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.opts input{width:20px;height:20px;accent-color:#3f9a55}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.item{font:inherit;color:var(--ink);text-align:left;border:3px solid var(--line);background:var(--paper-2);border-radius:18px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;transition:transform .12s}
.item:hover,.item:focus-visible{transform:translateY(-3px);border-color:var(--btn);outline:none}
.item .no{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:var(--btn);color:var(--btn-ink)}
.item b{display:block;font-weight:400;font-size:16.5px}
.item small{display:block;opacity:.72;font-size:12.5px;margin-top:2px;line-height:1.35}
.grp{margin:14px 2px 6px;font-size:14px;opacity:.7}
.room-foot{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:30;background:var(--sky);font-size:22px}
#loading.hide{display:none}
.err{color:#c0504d}
</style>
</head>
<body>
<canvas id="game" aria-label="통계 섬 3D 화면"></canvas>
<div id="loading">섬으로 가는 중… 🌴</div>

<div class="hud card" id="title">
  <h1><b>J</b>ust <b>D</b>o it 통계 섬</h1>
  <p class="keys">방향키·WASD로 걷기 · 건물 문 앞에서 <b>E</b> 또는 <b>Space</b> · 땅을 클릭하면 그곳으로 걸어가요</p>
  <p>건물을 누르면 들어가요. <b>?</b> 말풍선 주민은 통계 고민이 있어요 — 말을 걸어 알맞은 분석을 추천해 주세요! 오른쪽 ＋/－로 크기 조절.</p>
</div>
<div class="hud" id="top-right"><a class="btn ghost" href="index.html">🖥️ 웹 화면</a></div>
<div class="hud card" id="zoom" aria-label="크기 조절"><button id="zoom-in" aria-label="크게">＋</button><span id="zoom-lv">100%</span><button id="zoom-out" aria-label="작게">－</button></div>
<div class="hud card" id="map"><canvas id="mini" width="264" height="264" aria-label="섬 지도"></canvas></div>
<div class="hud card" id="prompt" role="button" tabindex="0"></div>
<div class="hud card" id="score" title="주민들의 통계 질문을 해결한 수">🏅 통계 도움 <b id="score-n">0</b>/<span id="score-t">0</span></div>
<div class="hud" id="joy" aria-label="이동 조이스틱"><i></i></div>

<div id="chat" role="dialog" aria-modal="true" aria-labelledby="chat-name">
  <div class="card">
    <div class="room-head"><span class="badge" id="chat-face"></span><div><h2 id="chat-name"></h2><small id="chat-sub"></small></div></div>
    <div class="talk" id="chat-q"></div>
    <p class="grp" id="chat-ask">어떤 분석을 추천해 줄까요?</p>
    <div class="grid" id="chat-opts"></div>
    <div class="talk" id="chat-fb" style="display:none"></div>
    <div class="room-foot"><button class="btn ghost" id="chat-close">👋 인사하고 헤어지기 (Esc)</button><span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" id="chat-next" style="display:none">다음 질문 →</button><a class="btn" id="chat-go" style="display:none" href="#">이 분석 하러 가기 →</a></span></div>
  </div>
</div>
<div id="room" role="dialog" aria-modal="true" aria-labelledby="room-name">
  <div class="card">
    <div class="room-head"><span class="badge" id="room-badge"></span><div><h2 id="room-name"></h2><small id="room-sub"></small></div></div>
    <div class="talk" id="room-talk"></div>
    <div class="opts"><label><input type="checkbox" id="room-ex"> 예시 데이터로 바로 체험하기</label><span id="room-hint" style="opacity:.7;font-size:13.5px">분석을 고르면 통계 화면이 열려요</span></div>
    <div id="room-list"></div>
    <div class="room-foot"><button class="btn ghost" id="room-close">🚪 밖으로 나가기 (Esc)</button><a class="btn" id="room-web" href="index.html">이 건물 전체 화면으로 →</a></div>
  </div>
</div>

<script>
(()=>{
// ================= 건물(터미널) 정보 =================
const B=[
 {k:'stat',name:'엑셀통계',sub:'기본 통계 8가지',emoji:'📊',color:0xffb36b,roof:0xd9644a,shape:'house',
  talk:'어서 오세요! 여기는 <b>엑셀통계</b> 집이에요. 빈도부터 상관분석까지, 처음 통계를 할 때 필요한 건 다 있어요.',
  groups:[['기본 분석',[['freq','빈도분석','값별 개수와 비율'],['desc','기술통계','평균 · 표준편차 · 분포'],['cross','교차분석','교차표 · 카이제곱'],['one','일표본 검증','기준값과 평균 비교'],
    ['ttest','차이검증','독립표본 t검정'],['paired','사전사후검증','대응표본 t검정'],['anova','ANOVA','일원분산분석 · 사후검정'],['corr','상관관계','Pearson 상관계수']]]]},
 {k:'exp',name:'실험조사',sub:'실험설계 10가지',emoji:'🧪',color:0x9fd8d0,roof:0x3f8f9a,shape:'lab',
  talk:'반가워요! <b>실험조사 연구소</b>예요. 설계 그림(R·X·O)과 내적 타당도까지 함께 보여 드려요.',
  groups:[['전실험설계',[['oneshot','일회 사례연구','X → O'],['onegroup','단일집단 사전-사후','O → X → O'],['static','정태적 집단비교','X O / O']]],
    ['준실험설계',[['noneq','비동등 통제집단','O X O / O O · ANCOVA'],['its','단속적 시계열','전·후 최대 5시점'],['rd','회귀불연속','기준점 불연속'],['cross','반복측정 교차설계','AB / BA']]],
    ['진실험설계',[['prepost','사전-사후 통제집단','R O X O / R O O'],['postonly','사후 통제집단','R X O / R O'],['solomon','솔로몬 4집단','처치 × 사전검사']]]]},
 {k:'dec',name:'전문가 합의 · 의사결정',sub:'델파이 · AHP',emoji:'🤝',color:0xc9b8f0,roof:0x7a63c9,shape:'tower',
  talk:'여기는 <b>전문가 합의 탑</b>이에요. 전문가 의견이 얼마나 모였는지, 무엇이 더 중요한지 숫자로 정리해요.',
  groups:[['전문가 합의 · 의사결정',[['delphi','델파이 분석','CVR · 합의도 · 수렴도'],['ahp','AHP 분석','쌍대비교 · 가중치 · CR']]]]},
 {k:'adv',name:'고급통계',sub:'회귀 · 척도 · 다변량',emoji:'🏛️',color:0xa9c7f5,roof:0x3d63b8,shape:'hall',
  talk:'<b>고급통계 회관</b>에 오신 걸 환영해요. 회귀분석, 요인분석, SEM, 생존분석까지 깊이 있는 분석을 해요.',
  groups:[['회귀 · 심화',[['reg','회귀분석','다중 선형회귀'],['logit','로지스틱 회귀','오즈비'],['ipa','IPA 분석','중요도 · 성과'],['med','매개효과','간접효과 · 부트스트랩'],['mod','조절효과','상호작용 · 단순기울기']]],
    ['척도 검증',[['rel','신뢰도 분석',"Cronbach's α"],['val','타당도 분석','탐색적 요인분석'],['cfa','확인적 요인분석 · SEM','적합도 · 경로']]],
    ['다변량 · 생존',[['disc','판별분석','분류 정확도'],['clus','군집분석','K-평균 · 덴드로그램'],['surv','생존분석','Kaplan-Meier · Cox']]]]},
 {k:'qual',name:'질적조사',sub:'전사 · 코딩 · 주제 도출',emoji:'💬',color:0xf7c6d4,roof:0xd0708f,shape:'cafe',
  talk:'따뜻한 차 한잔 하세요. 여기는 <b>질적조사 카페</b>예요. 면담 이야기를 코딩해서 주제로 정리해 드려요.',
  groups:[['질적 분석',[['stt','음성 → 텍스트','받아쓰기 · 화자 지정'],['code','코딩 · 범주화','하위범주 지정'],['hier','주제 도출','하위범주 → 범주 → 주제'],['quote','대상자별 인용문','주제별 “ ” 진술'],
    ['memo','연구자 메모','분석 메모'],['viz','시각화','코드트리 · 마인드맵 · 워드클라우드'],['exp','엑셀 · 워드 저장','보고서 · 예시 파일']]]]},
];

if(!window.THREE){document.getElementById('loading').innerHTML='<div style="text-align:center;padding:20px">3D 화면을 불러오지 못했어요.<br><small>인터넷 연결을 확인하거나</small><br><br><a class="btn" href="index.html">웹 화면으로 가기</a></div>';return;}

function init(){
// ================= 장면 =================
const canvas=document.getElementById('game');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const SKY=0xbfe8f5;scene.background=new THREE.Color(SKY);scene.fog=new THREE.Fog(SKY,70,150);
const camera=new THREE.PerspectiveCamera(34,1,.5,300);
scene.add(new THREE.HemisphereLight(0xfff7e0,0x86b884,.62));scene.add(new THREE.AmbientLight(0xffffff,.12));
const sun=new THREE.DirectionalLight(0xfff1d6,.85);sun.position.set(-30,50,25);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-60,right:60,top:60,bottom:-60,near:1,far:150});sun.shadow.bias=-.0006;scene.add(sun);
const M=(c,o={})=>new THREE.MeshLambertMaterial(Object.assign({color:c},o));
function mesh(g,m,{x=0,y=0,z=0,cast=true,receive=false}={}){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=cast;o.receiveShadow=receive;return o;}

// 바다 · 섬
const R=48;
const sea=mesh(new THREE.CircleGeometry(220,64),M(0x86d3e3),{y:-1.2,cast:false,receive:true});sea.rotation.x=-Math.PI/2;scene.add(sea);
const sand=mesh(new THREE.CylinderGeometry(R+4,R+6,1.6,72),M(0xf5e2b0),{y:-.8,cast:false,receive:true});scene.add(sand);
const cliff=mesh(new THREE.CylinderGeometry(R,R+.8,1.4,72),M(0x8fcf73),{y:-.7,cast:false,receive:true});scene.add(cliff);
const grass=mesh(new THREE.CircleGeometry(R,72),M(0x9ad97c),{y:.001,cast:false,receive:true});grass.rotation.x=-Math.PI/2;scene.add(grass);
// 잔디 무늬
const tufts=new THREE.Group();scene.add(tufts);
for(let i=0;i<70;i++){const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*(R-3);const d=mesh(new THREE.CircleGeometry(1.2+Math.random()*2.2,18),M(i%2?0x8ccf70:0xa8e08a),{x:Math.cos(a)*r,y:.01,z:Math.sin(a)*r,cast:false,receive:true});d.rotation.x=-Math.PI/2;tufts.add(d);}

// 광장 · 길
const pathM=M(0xf2dfb0);
function disc(r,x,z,y=.02){const d=mesh(new THREE.CircleGeometry(r,40),pathM,{x,y,z,cast:false,receive:true});d.rotation.x=-Math.PI/2;scene.add(d);return d;}
disc(9.5,0,0);
const BR=24,colliders=[];
B.forEach((b,i)=>{const a=-Math.PI/2+i*(Math.PI*2/B.length)+Math.PI/B.length*0;b.a=a;b.x=Math.cos(a)*BR;b.z=Math.sin(a)*BR;
  for(let t=.35;t<.86;t+=.06)disc(1.9,b.x*t,b.z*t,.025);});

function textTex(lines,{w=512,h=192,bg='#fff6dd',fg='#4a3b2a',border='#c9a86a',size=64,emoji=''}={}){
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  g.fillStyle=border;roundRect(g,0,0,w,h,36);g.fill();g.fillStyle=bg;roundRect(g,10,10,w-20,h-20,28);g.fill();
  g.fillStyle=fg;g.textAlign='center';g.textBaseline='middle';
  const L=Array.isArray(lines)?lines:[lines];
  L.forEach((t,i)=>{let s=i?size*.55:size;g.font=`${s}px Jua, "Noto Sans KR", sans-serif`;while(g.measureText((i?'':emoji)+t).width>w-60&&s>18){s-=2;g.font=`${s}px Jua, "Noto Sans KR", sans-serif`;}
    g.fillText((i?'':emoji)+t,w/2,h/2+(L.length>1?(i?size*.48:-size*.22):0));});
  const tx=new THREE.CanvasTexture(c);tx.anisotropy=4;return tx;}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

      if(l<.4){target=null;if(enterAfter){const b=enterAfter;enterAfter=null;near=b;openRoom(b);}}else{mx=dx/l;mz=dz/l;}}}

    const want=Math.atan2(mx,mz);let d=want-hero.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));hero.rotation.y+=d*Math.min(1,dt*12);walkT+=dt*11;}
  else walkT=0;

  body.position.y=1.05+bob;head.position.y=2.35+bob;head.rotation.z=moving?Math.sin(walkT)*.06:0;
  feet[0].position.z=.05+Math.sin(walkT)*.3;feet[1].position.z=.05-Math.sin(walkT)*.3;arms[0].rotation.x=Math.sin(walkT)*.6;arms[1].rotation.x=-Math.sin(walkT)*.6;
  shadowBlob.position.set(hero.position.x,.03,hero.position.z);

    else{prompt.innerHTML=bn?`${bn.p.emoji} ${bn.p.name}에게 말 걸기<kbd>E</kbd>`:`${best.emoji} ${best.name} 들어가기<kbd>E</kbd>`;prompt.style.display='block';}}
  // 카메라
  camPos.copy(hero.position).add(camOff);camera.position.lerp(camPos,1-Math.pow(.001,dt));look.copy(hero.position).add(new THREE.Vector3(0,1.5,lookAhead));camera.lookAt(look);

// 화면 비율에 맞춰 카메라 거리 조절: 세로로 긴 휴대폰 화면에서도 섬이 넉넉히 보이도록
// 휴대폰 판단: 마우스가 없는 터치 기기만 (컴퓨터 창을 줄여도 컴퓨터로 봄)
const PHONE=matchMedia('(hover:none) and (pointer:coarse)').matches;
const ZKEY=PHONE?'jd-island-zoom-phone':'jd-island-zoom-pc';
let ZOOM=1;try{ZOOM=+localStorage.getItem(ZKEY)||1;}catch{}
let lookAhead=0;
function setZoom(z){ZOOM=Math.max(.45,Math.min(3,z));try{localStorage.setItem(ZKEY,String(ZOOM));}catch{}resize();}
// 화면 비율에 맞춰 카메라 거리 조절 + 사용자가 고른 배율(＋/－, 휠, 두 손가락)
function resize(){const Wd=canvas.clientWidth||innerWidth,Ht=canvas.clientHeight||innerHeight,a=Wd/Ht;renderer.setSize(Wd,Ht,false);camera.aspect=a;
  const portrait=a<1;camera.fov=portrait?44:34;
  // 가로 화면은 지금 컴퓨터 화면 그대로, 세로 화면은 가로 폭이 좁으므로 보이는 폭을 맞춰 거리를 늘림
  const hTan=Math.tan(camera.fov*Math.PI/360)*a,base=portrait?Math.max(1,Math.min(2.6,24/(2*39*hTan))):1;
  const k=base*ZOOM;
  camOff.set(0,30*k,25*k);lookAhead=portrait?-1.5*k:0;
  scene.fog.near=60+45*(k-1);scene.fog.far=150+110*(k-1);camera.far=300+200*Math.max(0,k-1);camera.updateProjectionMatrix();
  const zl=document.getElementById('zoom-lv');if(zl)zl.textContent=Math.round(100/ZOOM)+'%';}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,250));if(window.visualViewport)visualViewport.addEventListener('resize',resize);resize();
camera.position.copy(hero.position).add(camOff);
window.__island={hero,B,openRoom,npcs,openChat};
document.getElementById('loading').classList.add('hide');requestAnimationFrame(step);
}
// 간판 글꼴(Jua)을 먼저 받고 섬을 그림 (최대 2초 대기)
const fontReady=document.fonts&&document.fonts.load?document.fonts.load('40px Jua').catch(()=>{}):Promise.resolve();
Promise.race([fontReady,new Promise(r=>setTimeout(r,2000))]).then(init);
})();
</script>
