<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Just Do it 통계 섬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Caveat:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --ink:#4a3b2a;--paper:#fff8e8;--paper-2:#fdf0cf;--line:#e8d6a8;--leaf:#6cbf6a;--leaf-deep:#3f9a55;--sky:#bfe8f5;
  --btn:#ffcf5a;--btn-ink:#4a3b2a;--blue:#2a63d4;--shadow:0 6px 0 rgba(120,90,40,.18),0 12px 28px rgba(80,60,20,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#fff3dc;--paper:#3a3349;--paper-2:#463e57;--line:#5b5170;--sky:#2b3557;--btn:#f3c64f;--btn-ink:#2b2433;--blue:#8fb8ff;}}
:root[data-theme="dark"]{--ink:#fff3dc;--paper:#3a3349;--paper-2:#463e57;--line:#5b5170;--sky:#2b3557;--btn:#f3c64f;--btn-ink:#2b2433;--blue:#8fb8ff;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);font-family:Jua,"Noto Sans KR",system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;display:block;touch-action:none}
.hud{position:fixed;z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}
.card{background:var(--paper);border:3px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
#title{top:14px;left:14px;padding:10px 16px;max-width:min(360px,calc(100vw - 28px))}
#title h1{margin:0;font-family:Caveat,Jua,cursive;font-size:30px;line-height:1;font-weight:700}
#title h1 b{color:var(--blue);font-size:1.25em}
#title p{margin:6px 0 0;font-size:13.5px;opacity:.85;line-height:1.45}
#top-right{top:14px;right:14px;display:flex;gap:8px}
.btn{font:inherit;border:3px solid rgba(0,0,0,.08);background:var(--btn);color:var(--btn-ink);border-radius:999px;padding:9px 16px;font-size:15px;cursor:pointer;box-shadow:0 4px 0 rgba(120,90,40,.25);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(120,90,40,.25)}
.btn.ghost{background:var(--paper)}
#map{bottom:16px;right:16px;padding:6px;border-radius:50%}
#map canvas{display:block;border-radius:50%;width:132px;height:132px}
#prompt{left:50%;bottom:34px;transform:translateX(-50%);padding:12px 22px;font-size:19px;display:none;cursor:pointer;white-space:nowrap;animation:bob 1.4s ease-in-out infinite}
#prompt kbd{font-family:inherit;background:var(--btn);border-radius:8px;padding:1px 8px;margin-left:6px;font-size:15px}
@keyframes bob{50%{transform:translateX(-50%) translateY(-5px)}}
#joy{left:22px;bottom:22px;width:128px;height:128px;border-radius:50%;background:rgba(255,248,232,.55);border:3px solid rgba(232,214,168,.9);display:none;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--btn);box-shadow:0 4px 0 rgba(120,90,40,.25)}
@media (max-width:560px),(max-height:500px){#title{max-width:calc(100vw - 130px);padding:6px 12px;top:10px;left:10px;border-width:2px;border-radius:16px}#title h1{font-size:19px}#title p{display:none}
  #top-right{top:10px;right:10px}.btn{padding:6px 12px;font-size:13px;border-width:2px}
  #prompt{font-size:15px;padding:9px 16px;bottom:150px;border-width:2px}#prompt kbd{display:none}
  #room{padding:10px}#room .card{padding:14px 14px 12px;border-radius:18px}#room .room-head .badge{width:44px;height:44px;font-size:22px;border-radius:14px}#room .room-head h2{font-size:20px}#room .room-head small{font-size:12.5px}
  #room .talk{font-size:14px;padding:10px 12px;margin:12px 0 10px}#room .opts{font-size:13.5px}#room #room-hint{display:none}
  #room .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}#room .item{padding:9px 10px;border-width:2px;border-radius:14px;gap:8px}#room .item .no{width:24px;height:24px;font-size:12px}#room .item b{font-size:14.5px}#room .item small{font-size:11.5px}
  #room .room-foot .btn{flex:1;justify-content:center}}
@media (pointer:coarse){#joy{display:block;width:108px;height:108px;left:16px;bottom:16px}#joy i{width:44px;height:44px;margin:-22px 0 0 -22px}#map{right:10px;bottom:12px;padding:4px}#map canvas{width:84px;height:84px}#title p.keys{display:none}}
/* 건물 안 */
#room{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(60,45,25,.35);padding:16px}
#room.open{display:flex}
#room .card{width:min(860px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px 22px 18px;background:var(--paper);animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.room-head{display:flex;align-items:center;gap:14px}
.room-head .badge{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:30px;flex:none}
.room-head h2{margin:0;font-size:26px;font-weight:400}
.room-head small{display:block;opacity:.75;font-size:14px;margin-top:2px}
.talk{margin:16px 0 14px;padding:12px 16px;border-radius:18px;background:var(--paper-2);font-size:16px;position:relative}
.talk b{font-weight:400;color:var(--leaf-deep)}
.opts{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:15px}
.opts label{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.opts input{width:20px;height:20px;accent-color:#3f9a55}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.item{font:inherit;color:var(--ink);text-align:left;border:3px solid var(--line);background:var(--paper-2);border-radius:18px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;transition:transform .12s}
.item:hover,.item:focus-visible{transform:translateY(-3px);border-color:var(--btn);outline:none}
.item .no{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:var(--btn);color:var(--btn-ink)}
.item b{display:block;font-weight:400;font-size:16.5px}
.item small{display:block;opacity:.72;font-size:12.5px;margin-top:2px;line-height:1.35}
.grp{margin:14px 2px 6px;font-size:14px;opacity:.7}
.room-foot{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:30;background:var(--sky);font-size:22px}
#loading.hide{display:none}
.err{color:#c0504d}
</style>
</head>
<body>
<canvas id="game" aria-label="통계 섬 3D 화면"></canvas>
<div id="loading">섬으로 가는 중… 🌴</div>

<div class="hud card" id="title">
  <h1><b>J</b>ust <b>D</b>o it 통계 섬</h1>
  <p class="keys">방향키·WASD로 걷기 · 건물 문 앞에서 <b>E</b> 또는 <b>Space</b> · 땅을 클릭하면 그곳으로 걸어가요</p>
  <p>건물을 누르면 문 앞까지 걸어가서 들어가요.</p>
</div>
<div class="hud" id="top-right"><a class="btn ghost" href="index.html">🖥️ 웹 화면</a></div>
<div class="hud card" id="map"><canvas id="mini" width="264" height="264" aria-label="섬 지도"></canvas></div>
<div class="hud card" id="prompt" role="button" tabindex="0"></div>
<div class="hud" id="joy" aria-label="이동 조이스틱"><i></i></div>

<div id="room" role="dialog" aria-modal="true" aria-labelledby="room-name">
  <div class="card">
    <div class="room-head"><span class="badge" id="room-badge"></span><div><h2 id="room-name"></h2><small id="room-sub"></small></div></div>
    <div class="talk" id="room-talk"></div>
    <div class="opts"><label><input type="checkbox" id="room-ex"> 예시 데이터로 바로 체험하기</label><span id="room-hint" style="opacity:.7;font-size:13.5px">분석을 고르면 통계 화면이 열려요</span></div>
    <div id="room-list"></div>
    <div class="room-foot"><button class="btn ghost" id="room-close">🚪 밖으로 나가기 (Esc)</button><a class="btn" id="room-web" href="index.html">이 건물 전체 화면으로 →</a></div>
  </div>
</div>

<script>
(()=>{
// ================= 건물(터미널) 정보 =================
const B=[
 {k:'stat',name:'엑셀통계',sub:'기본 통계 8가지',emoji:'📊',color:0xffb36b,roof:0xd9644a,shape:'house',
  talk:'어서 오세요! 여기는 <b>엑셀통계</b> 집이에요. 빈도부터 상관분석까지, 처음 통계를 할 때 필요한 건 다 있어요.',
  groups:[['기본 분석',[['freq','빈도분석','값별 개수와 비율'],['desc','기술통계','평균 · 표준편차 · 분포'],['cross','교차분석','교차표 · 카이제곱'],['one','일표본 검증','기준값과 평균 비교'],
    ['ttest','차이검증','독립표본 t검정'],['paired','사전사후검증','대응표본 t검정'],['anova','ANOVA','일원분산분석 · 사후검정'],['corr','상관관계','Pearson 상관계수']]]]},
 {k:'exp',name:'실험조사',sub:'실험설계 10가지',emoji:'🧪',color:0x9fd8d0,roof:0x3f8f9a,shape:'lab',
  talk:'반가워요! <b>실험조사 연구소</b>예요. 설계 그림(R·X·O)과 내적 타당도까지 함께 보여 드려요.',
  groups:[['전실험설계',[['oneshot','일회 사례연구','X → O'],['onegroup','단일집단 사전-사후','O → X → O'],['static','정태적 집단비교','X O / O']]],
    ['준실험설계',[['noneq','비동등 통제집단','O X O / O O · ANCOVA'],['its','단속적 시계열','전·후 최대 5시점'],['rd','회귀불연속','기준점 불연속'],['cross','반복측정 교차설계','AB / BA']]],
    ['진실험설계',[['prepost','사전-사후 통제집단','R O X O / R O O'],['postonly','사후 통제집단','R X O / R O'],['solomon','솔로몬 4집단','처치 × 사전검사']]]]},
 {k:'dec',name:'전문가 합의 · 의사결정',sub:'델파이 · AHP',emoji:'🤝',color:0xc9b8f0,roof:0x7a63c9,shape:'tower',
  talk:'여기는 <b>전문가 합의 탑</b>이에요. 전문가 의견이 얼마나 모였는지, 무엇이 더 중요한지 숫자로 정리해요.',
  groups:[['전문가 합의 · 의사결정',[['delphi','델파이 분석','CVR · 합의도 · 수렴도'],['ahp','AHP 분석','쌍대비교 · 가중치 · CR']]]]},
 {k:'adv',name:'고급통계',sub:'회귀 · 척도 · 다변량',emoji:'🏛️',color:0xa9c7f5,roof:0x3d63b8,shape:'hall',
  talk:'<b>고급통계 회관</b>에 오신 걸 환영해요. 회귀분석, 요인분석, SEM, 생존분석까지 깊이 있는 분석을 해요.',
  groups:[['회귀 · 심화',[['reg','회귀분석','다중 선형회귀'],['logit','로지스틱 회귀','오즈비'],['ipa','IPA 분석','중요도 · 성과'],['med','매개효과','간접효과 · 부트스트랩'],['mod','조절효과','상호작용 · 단순기울기']]],
    ['척도 검증',[['rel','신뢰도 분석',"Cronbach's α"],['val','타당도 분석','탐색적 요인분석'],['cfa','확인적 요인분석 · SEM','적합도 · 경로']]],
    ['다변량 · 생존',[['disc','판별분석','분류 정확도'],['clus','군집분석','K-평균 · 덴드로그램'],['surv','생존분석','Kaplan-Meier · Cox']]]]},
 {k:'qual',name:'질적조사',sub:'전사 · 코딩 · 주제 도출',emoji:'💬',color:0xf7c6d4,roof:0xd0708f,shape:'cafe',
  talk:'따뜻한 차 한잔 하세요. 여기는 <b>질적조사 카페</b>예요. 면담 이야기를 코딩해서 주제로 정리해 드려요.',
  groups:[['질적 분석',[['stt','음성 → 텍스트','받아쓰기 · 화자 지정'],['code','코딩 · 범주화','하위범주 지정'],['hier','주제 도출','하위범주 → 범주 → 주제'],['quote','대상자별 인용문','주제별 “ ” 진술'],
    ['memo','연구자 메모','분석 메모'],['viz','시각화','코드트리 · 마인드맵 · 워드클라우드'],['exp','엑셀 · 워드 저장','보고서 · 예시 파일']]]]},
];

if(!window.THREE){document.getElementById('loading').innerHTML='<div style="text-align:center;padding:20px">3D 화면을 불러오지 못했어요.<br><small>인터넷 연결을 확인하거나</small><br><br><a class="btn" href="index.html">웹 화면으로 가기</a></div>';return;}

function init(){
// ================= 장면 =================
const canvas=document.getElementById('game');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const SKY=0xbfe8f5;scene.background=new THREE.Color(SKY);scene.fog=new THREE.Fog(SKY,70,150);
const camera=new THREE.PerspectiveCamera(34,1,.5,300);
scene.add(new THREE.HemisphereLight(0xfff7e0,0x86b884,.62));scene.add(new THREE.AmbientLight(0xffffff,.12));
const sun=new THREE.DirectionalLight(0xfff1d6,.85);sun.position.set(-30,50,25);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-60,right:60,top:60,bottom:-60,near:1,far:150});sun.shadow.bias=-.0006;scene.add(sun);
const M=(c,o={})=>new THREE.MeshLambertMaterial(Object.assign({color:c},o));
function mesh(g,m,{x=0,y=0,z=0,cast=true,receive=false}={}){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=cast;o.receiveShadow=receive;return o;}

// 바다 · 섬
const R=48;
const sea=mesh(new THREE.CircleGeometry(220,64),M(0x86d3e3),{y:-1.2,cast:false,receive:true});sea.rotation.x=-Math.PI/2;scene.add(sea);
const sand=mesh(new THREE.CylinderGeometry(R+4,R+6,1.6,72),M(0xf5e2b0),{y:-.8,cast:false,receive:true});scene.add(sand);
const cliff=mesh(new THREE.CylinderGeometry(R,R+.8,1.4,72),M(0x8fcf73),{y:-.7,cast:false,receive:true});scene.add(cliff);
const grass=mesh(new THREE.CircleGeometry(R,72),M(0x9ad97c),{y:.001,cast:false,receive:true});grass.rotation.x=-Math.PI/2;scene.add(grass);
// 잔디 무늬
const tufts=new THREE.Group();scene.add(tufts);
for(let i=0;i<70;i++){const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*(R-3);const d=mesh(new THREE.CircleGeometry(1.2+Math.random()*2.2,18),M(i%2?0x8ccf70:0xa8e08a),{x:Math.cos(a)*r,y:.01,z:Math.sin(a)*r,cast:false,receive:true});d.rotation.x=-Math.PI/2;tufts.add(d);}

// 광장 · 길
const pathM=M(0xf2dfb0);
function disc(r,x,z,y=.02){const d=mesh(new THREE.CircleGeometry(r,40),pathM,{x,y,z,cast:false,receive:true});d.rotation.x=-Math.PI/2;scene.add(d);return d;}
disc(9.5,0,0);
const BR=24,colliders=[];
B.forEach((b,i)=>{const a=-Math.PI/2+i*(Math.PI*2/B.length)+Math.PI/B.length*0;b.a=a;b.x=Math.cos(a)*BR;b.z=Math.sin(a)*BR;
  for(let t=.35;t<.86;t+=.06)disc(1.9,b.x*t,b.z*t,.025);});

// 분수
const fountain=new THREE.Group();scene.add(fountain);
fountain.add(mesh(new THREE.CylinderGeometry(3.4,3.8,1,32),M(0xd8cbb4),{y:.5}));
const water=mesh(new THREE.CylinderGeometry(2.9,2.9,.2,32),M(0x7fd0f0),{y:.95,cast:false});fountain.add(water);
fountain.add(mesh(new THREE.CylinderGeometry(.5,.7,2.2,16),M(0xd8cbb4),{y:1.6}));
fountain.add(mesh(new THREE.SphereGeometry(.9,20,14),M(0x9ee3ff),{y:2.9}));
colliders.push({x:0,z:0,r:4.2});

// 글자 판 텍스처
function textTex(lines,{w=512,h=192,bg='#fff6dd',fg='#4a3b2a',border='#c9a86a',size=64,emoji=''}={}){
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  g.fillStyle=border;roundRect(g,0,0,w,h,36);g.fill();g.fillStyle=bg;roundRect(g,10,10,w-20,h-20,28);g.fill();
  g.fillStyle=fg;g.textAlign='center';g.textBaseline='middle';
  const L=Array.isArray(lines)?lines:[lines];
  L.forEach((t,i)=>{let s=i?size*.55:size;g.font=`${s}px Jua, "Noto Sans KR", sans-serif`;while(g.measureText((i?'':emoji)+t).width>w-60&&s>18){s-=2;g.font=`${s}px Jua, "Noto Sans KR", sans-serif`;}
    g.fillText((i?'':emoji)+t,w/2,h/2+(L.length>1?(i?size*.48:-size*.22):0));});
  const tx=new THREE.CanvasTexture(c);tx.anisotropy=4;return tx;}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

// ================= 건물 =================
const clickables=[];
function building(b){
  const g=new THREE.Group();g.position.set(b.x,0,b.z);g.rotation.y=-b.a-Math.PI/2;scene.add(g);
  const wall=M(b.color),roof=M(b.roof),wood=M(0x8a5a3c),win=M(0xfff3b0,{emissive:0x5a4a10,emissiveIntensity:.25}),white=M(0xfffaf0);
  let W=7.5,D=6,H=4.2,doorZ=D/2;
  if(b.shape==='tower'){const body=mesh(new THREE.CylinderGeometry(3.6,3.9,7,28),wall,{y:3.5});g.add(body);
    g.add(mesh(new THREE.ConeGeometry(4.5,4,28),roof,{y:9}));g.add(mesh(new THREE.SphereGeometry(.5,12,10),M(0xffd35a),{y:11.2}));
    doorZ=3.75;H=7;for(const y of [4.5,6]){const w=mesh(new THREE.CircleGeometry(.55,16),win,{y,z:3.82,cast:false});g.add(w);}}
  else{
    if(b.shape==='hall'){W=10;D=7;H=5.6;}
    g.add(mesh(new THREE.BoxGeometry(W,H,D),wall,{y:H/2}));
    g.add(mesh(new THREE.BoxGeometry(W+.4,.5,D+.4),M(0xfffaf0),{y:.25}));
    if(b.shape==='hall'){g.add(mesh(new THREE.BoxGeometry(W+1,.8,D+1),roof,{y:H+.4}));const p=mesh(new THREE.CylinderGeometry(0,W*.62,3.2,4),roof,{y:H+2.4});p.rotation.y=Math.PI/4;p.scale.z=.75;g.add(p);
      for(const x of [-3.6,-1.2,1.2,3.6])g.add(mesh(new THREE.CylinderGeometry(.32,.36,H-.4,14),white,{x,y:(H-.4)/2+.2,z:D/2+.6}));}
    else{const p=mesh(new THREE.CylinderGeometry(0,W*.68,3.4,4),roof,{y:H+1.7});p.rotation.y=Math.PI/4;p.scale.z=.85;g.add(p);}
    if(b.shape==='lab'){g.add(mesh(new THREE.CylinderGeometry(.7,.9,3,16),M(0xdfe9ee),{x:2.2,y:H+2.3,z:-1}));g.add(mesh(new THREE.SphereGeometry(1.1,16,12),M(0xb9f0e3,{transparent:true,opacity:.9}),{x:-2.3,y:H+1.4,z:1.2}));}
    if(b.shape==='cafe'){for(let i=0;i<6;i++){const s=mesh(new THREE.BoxGeometry(W/6,.25,1.8),M(i%2?0xffffff:0xe86f8f),{x:-W/2+W/12+i*W/6,y:H-.6,z:D/2+.9});s.rotation.x=.35;g.add(s);}
      for(const x of [-4.8,4.8]){g.add(mesh(new THREE.CylinderGeometry(.9,.9,.12,18),white,{x,y:1.1,z:D/2+2}));g.add(mesh(new THREE.CylinderGeometry(.12,.12,1.1,8),wood,{x,y:.55,z:D/2+2}));}}
    for(const x of (b.shape==='hall'?[-3.4,3.4]:[-2.3,2.3]))g.add(mesh(new THREE.BoxGeometry(1.5,1.3,.12),win,{x,y:H*.55,z:D/2+.02,cast:false}));
  }
  g.add(mesh(new THREE.BoxGeometry(1.6,2.6,.2),wood,{y:1.3,z:doorZ+.02}));
  g.add(mesh(new THREE.SphereGeometry(.12,8,8),M(0xffd35a),{x:.5,y:1.3,z:doorZ+.15,cast:false}));
  // 간판
  const sign=mesh(new THREE.PlaneGeometry(5.2,1.95),new THREE.MeshBasicMaterial({map:textTex([b.name,b.sub],{emoji:b.emoji+' '})}),{y:(b.shape==='tower'?5.3:b.shape==='hall'?H-1.2:H-.9)+.3,z:doorZ+.08,cast:false});
  if(b.shape==='tower'){sign.position.y=2.9+2.2;sign.position.z=3.95;sign.scale.set(.82,.82,1);}
  g.add(sign);
  // 문 앞 팻말
  const post=new THREE.Group();post.position.set(2.6,0,doorZ+2.6);g.add(post);
  post.add(mesh(new THREE.CylinderGeometry(.13,.13,1.8,8),wood,{y:.9}));
  const board=mesh(new THREE.BoxGeometry(2.4,.9,.12),M(0xf6e7c1),{y:1.85});post.add(board);
  const bf=mesh(new THREE.PlaneGeometry(2.3,.8),new THREE.MeshBasicMaterial({map:textTex(b.name,{w:384,h:128,size:56,border:'#f6e7c1'})}),{y:1.85,z:.07,cast:false});post.add(bf);
  g.updateMatrixWorld(true);
  const door=new THREE.Vector3(0,0,doorZ+2.2).applyMatrix4(g.matrixWorld);b.door=door;
  colliders.push({x:b.x,z:b.z,r:b.shape==='hall'?6.2:b.shape==='tower'?4.4:5.0});
  g.traverse(o=>{if(o.isMesh){o.userData.b=b;clickables.push(o);}});
  b.group=g;
}
B.forEach(building);

// ================= 나무 · 꽃 · 돌 =================
const trunkG=new THREE.CylinderGeometry(.32,.45,2,8),leafG=new THREE.SphereGeometry(1.6,16,12),leafM=[M(0x5fb85b),M(0x6cc366),M(0x52a84f)],trunkM=M(0x9b6b43);
const fruitM=M(0xff7a5c),flowerC=[0xff8fb1,0xfff07a,0xffffff,0xb59cff,0xff9f5a],stoneM=M(0xc9c3b6);
const blocked=(x,z,r)=>Math.hypot(x,z)<14+r||colliders.some(c=>Math.hypot(x-c.x,z-c.z)<c.r+r+1.5)||B.some(b=>{const t=(x*b.x+z*b.z)/(BR*BR);if(t<0||t>1)return false;return Math.hypot(x-b.x*t,z-b.z*t)<3.2+r;});
let seed=7;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
for(let i=0,n=0;i<600&&n<62;i++){const a=rnd()*Math.PI*2,r=14+rnd()*(R-17),x=Math.cos(a)*r,z=Math.sin(a)*r;if(blocked(x,z,1.6))continue;n++;
  const t=new THREE.Group();t.position.set(x,0,z);const s=.85+rnd()*.5;t.scale.setScalar(s);
  t.add(mesh(trunkG,trunkM,{y:1}));const L=leafM[n%3];
  t.add(mesh(leafG,L,{y:3}));t.add(mesh(leafG,L,{x:.9,y:2.5,z:.3}));t.add(mesh(leafG,L,{x:-.8,y:2.6,z:-.4}));const top=mesh(leafG,L,{y:3.9});top.scale.setScalar(.75);t.add(top);
  if(n%4===0)for(let k=0;k<3;k++)t.add(mesh(new THREE.SphereGeometry(.28,10,8),fruitM,{x:Math.cos(k*2.1)*1.5,y:2.6+k*.35,z:Math.sin(k*2.1)*1.5}));
  scene.add(t);colliders.push({x,z,r:1.1*s});}
for(let i=0,n=0;i<900&&n<150;i++){const a=rnd()*Math.PI*2,r=10+rnd()*(R-12),x=Math.cos(a)*r,z=Math.sin(a)*r;if(blocked(x,z,.3))continue;n++;
  const c=flowerC[n%flowerC.length],f=new THREE.Group();f.position.set(x,0,z);
  f.add(mesh(new THREE.CylinderGeometry(.04,.04,.5,5),M(0x4f9a46),{y:.25,cast:false}));
  for(let k=0;k<5;k++)f.add(mesh(new THREE.SphereGeometry(.16,8,6),M(c),{x:Math.cos(k*1.256)*.18,y:.55,z:Math.sin(k*1.256)*.18,cast:false}));
  f.add(mesh(new THREE.SphereGeometry(.11,8,6),M(0xffd35a),{y:.6,cast:false}));scene.add(f);}
for(let i=0,n=0;i<200&&n<14;i++){const a=rnd()*Math.PI*2,r=12+rnd()*(R-15),x=Math.cos(a)*r,z=Math.sin(a)*r;if(blocked(x,z,1))continue;n++;
  const s=mesh(new THREE.DodecahedronGeometry(.7+rnd()*.5,1),stoneM,{x,y:.35,z});s.scale.y=.6;scene.add(s);colliders.push({x,z,r:.9});}
// 가운데 팻말
const welcome=new THREE.Group();welcome.position.set(0,0,-6.3);scene.add(welcome);
welcome.add(mesh(new THREE.CylinderGeometry(.16,.16,2.4,8),trunkM,{x:-1.9,y:1.2}));welcome.add(mesh(new THREE.CylinderGeometry(.16,.16,2.4,8),trunkM,{x:1.9,y:1.2}));
welcome.add(mesh(new THREE.PlaneGeometry(4.6,1.6),new THREE.MeshBasicMaterial({map:textTex(['Just Do it 통계 섬','건물에 들어가 분석을 골라 보세요'],{size:60}),side:THREE.DoubleSide}),{y:2.3,cast:false}));
colliders.push({x:0,z:-6.3,r:.6});

// ================= 주인공 (동글동글 곰돌이) =================
const hero=new THREE.Group();scene.add(hero);
const fur=M(0xf2c38f),furD=M(0xd99b62),dark=M(0x3a2a20),cheek=M(0xff9aa2),shirt=M(0x6fb7ff);
const body=mesh(new THREE.SphereGeometry(.9,24,18),shirt,{y:1.05});body.scale.set(1,1.05,.9);hero.add(body);
const head=new THREE.Group();head.position.y=2.35;hero.add(head);
const hd=mesh(new THREE.SphereGeometry(1.05,28,20),fur);hd.scale.set(1.08,.95,1);head.add(hd);
for(const s of [-1,1]){head.add(mesh(new THREE.SphereGeometry(.34,16,12),furD,{x:.72*s,y:.78,z:-.05}));
  head.add(mesh(new THREE.SphereGeometry(.12,10,8),dark,{x:.36*s,y:.08,z:.92,cast:false}));
  const ck=mesh(new THREE.SphereGeometry(.17,10,8),cheek,{x:.62*s,y:-.18,z:.78,cast:false});ck.scale.z=.4;head.add(ck);}
const snout=mesh(new THREE.SphereGeometry(.32,14,10),M(0xfbe3c4),{y:-.2,z:.92,cast:false});snout.scale.set(1.2,.8,.6);head.add(snout);
head.add(mesh(new THREE.SphereGeometry(.09,8,6),dark,{y:-.08,z:1.1,cast:false}));
const feet=[-1,1].map(s=>{const f=mesh(new THREE.SphereGeometry(.32,12,10),furD,{x:.42*s,y:.25,z:.05});f.scale.set(1,.7,1.25);hero.add(f);return f;});
const arms=[-1,1].map(s=>{const a=mesh(new THREE.SphereGeometry(.26,12,10),fur,{x:.95*s,y:1.15,z:.05});a.scale.set(.9,1.3,.9);hero.add(a);return a;});
const shadowBlob=mesh(new THREE.CircleGeometry(1,24),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.14}),{y:.03,cast:false});shadowBlob.rotation.x=-Math.PI/2;scene.add(shadowBlob);
hero.position.set(0,0,7);hero.rotation.y=Math.PI;

// ================= 조작 =================
const keys={};let joy={x:0,y:0},target=null,enterAfter=null,near=null,roomOpen=false;
addEventListener('keydown',e=>{if(roomOpen){if(e.key==='Escape')closeRoom();return;}
  keys[e.key.toLowerCase()]=true;if((e.key==='e'||e.key==='E'||e.key===' '||e.key==='Enter')&&near){e.preventDefault();openRoom(near);}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
canvas.addEventListener('pointerdown',e=>{if(roomOpen)return;
  ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(clickables,false)[0];
  if(hit&&hit.object.userData.b){const b=hit.object.userData.b;target=b.door.clone();enterAfter=b;return;}
  const p=new THREE.Vector3();if(ray.ray.intersectPlane(plane,p)){target=p;enterAfter=null;}});
const jEl=document.getElementById('joy'),jK=jEl.querySelector('i');let jId=null;
jEl.addEventListener('pointerdown',e=>{jId=e.pointerId;jEl.setPointerCapture(jId);moveJoy(e);});
jEl.addEventListener('pointermove',e=>{if(e.pointerId===jId)moveJoy(e);});
const endJoy=()=>{jId=null;joy={x:0,y:0};jK.style.transform='';};jEl.addEventListener('pointerup',endJoy);jEl.addEventListener('pointercancel',endJoy);
function moveJoy(e){const r=jEl.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2);const l=Math.hypot(x,y);if(l>1){x/=l;y/=l;}
  joy={x,y};target=null;jK.style.transform=`translate(${x*30}px,${y*30}px)`;}
const prompt=document.getElementById('prompt');
prompt.addEventListener('click',()=>near&&openRoom(near));prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&near)openRoom(near);});

// ================= 건물 안 =================
const room=document.getElementById('room');
const exBox=document.getElementById('room-ex');try{exBox.checked=localStorage.getItem('jd-island-ex')==='1';}catch{}
exBox.addEventListener('change',()=>{try{localStorage.setItem('jd-island-ex',exBox.checked?'1':'0');}catch{}});
function openRoom(b){roomOpen=true;target=null;enterAfter=null;for(const k in keys)keys[k]=false;
  document.getElementById('room-badge').textContent=b.emoji;document.getElementById('room-badge').style.background='#'+b.color.toString(16).padStart(6,'0');
  document.getElementById('room-name').textContent=b.name;document.getElementById('room-sub').textContent=b.sub;
  document.getElementById('room-talk').innerHTML='🐻 안내원: '+b.talk+' 오늘은 어떤 분석을 해 볼까요?';
  document.getElementById('room-web').href='index.html#'+b.k;
  let n=0;document.getElementById('room-list').innerHTML=b.groups.map(([g,items])=>`${b.groups.length>1?`<p class="grp">${g}</p>`:''}<div class="grid">${items.map(([k,t,s])=>`<button class="item" data-go="${b.k}/${k}"><span class="no">${++n}</span><span><b>${t}</b><small>${s}</small></span></button>`).join('')}</div>`).join('');
  room.classList.add('open');prompt.style.display='none';setTimeout(()=>room.querySelector('.item')?.focus(),50);}
function closeRoom(){room.classList.remove('open');roomOpen=false;
  // 문 앞에서 한 걸음 물러나기
  if(near){const d=new THREE.Vector3().subVectors(near.door,new THREE.Vector3(near.x,0,near.z)).normalize();hero.position.copy(near.door).addScaledVector(d,1.6);}}
document.getElementById('room-close').addEventListener('click',closeRoom);
room.addEventListener('click',e=>{if(e.target===room)closeRoom();const it=e.target.closest('[data-go]');if(it)location.href='index.html#'+it.dataset.go+(exBox.checked?'/ex':'');});

// ================= 미니맵 =================
const mini=document.getElementById('mini'),mg=mini.getContext('2d');
function drawMini(){const S=mini.width,sc=S/2/(R+6),c=S/2;mg.clearRect(0,0,S,S);
  mg.fillStyle='#86d3e3';mg.fillRect(0,0,S,S);mg.fillStyle='#f5e2b0';mg.beginPath();mg.arc(c,c,(R+4)*sc,0,7);mg.fill();
  mg.fillStyle='#9ad97c';mg.beginPath();mg.arc(c,c,R*sc,0,7);mg.fill();mg.fillStyle='#f2dfb0';mg.beginPath();mg.arc(c,c,9.5*sc,0,7);mg.fill();
  B.forEach(b=>{mg.fillStyle='#'+b.color.toString(16).padStart(6,'0');mg.strokeStyle='#4a3b2a';mg.lineWidth=3;mg.beginPath();mg.arc(c+b.x*sc,c+b.z*sc,12,0,7);mg.fill();mg.stroke();
    mg.font='18px Jua, sans-serif';mg.textAlign='center';mg.textBaseline='middle';mg.fillStyle='#4a3b2a';mg.fillText(b.emoji,c+b.x*sc,c+b.z*sc+1);});
  const hx=c+hero.position.x*sc,hz=c+hero.position.z*sc;mg.fillStyle='#ff5a5a';mg.strokeStyle='#fff';mg.lineWidth=4;mg.beginPath();mg.arc(hx,hz,9,0,7);mg.fill();mg.stroke();}

// ================= 움직임 =================
const clock=new THREE.Clock();let walkT=0;const camOff=new THREE.Vector3(0,30,25),camPos=new THREE.Vector3(),look=new THREE.Vector3();
function resolve(p){const d=Math.hypot(p.x,p.z);if(d>R-1.5){p.x*=(R-1.5)/d;p.z*=(R-1.5)/d;}
  for(const c of colliders){const dx=p.x-c.x,dz=p.z-c.z,l=Math.hypot(dx,dz),m=c.r+.8;if(l<m&&l>1e-6){p.x=c.x+dx/l*m;p.z=c.z+dz/l*m;}}}
function step(){const dt=Math.min(.05,clock.getDelta());
  let mx=0,mz=0;
  if(!roomOpen){if(keys['arrowup']||keys['w'])mz-=1;if(keys['arrowdown']||keys['s'])mz+=1;if(keys['arrowleft']||keys['a'])mx-=1;if(keys['arrowright']||keys['d'])mx+=1;
    mx+=joy.x;mz+=joy.y;if(mx||mz)target=null;
    if(target){const dx=target.x-hero.position.x,dz=target.z-hero.position.z,l=Math.hypot(dx,dz);
      if(l<.4){target=null;if(enterAfter){const b=enterAfter;enterAfter=null;near=b;openRoom(b);}}else{mx=dx/l;mz=dz/l;}}}
  const len=Math.hypot(mx,mz),moving=len>.05;
  if(moving){mx/=Math.max(1,len);mz/=Math.max(1,len);const sp=9.5;hero.position.x+=mx*sp*dt;hero.position.z+=mz*sp*dt;resolve(hero.position);
    const want=Math.atan2(mx,mz);let d=want-hero.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));hero.rotation.y+=d*Math.min(1,dt*12);walkT+=dt*11;}
  else walkT=0;
  const bob=moving?Math.abs(Math.sin(walkT))*.18:Math.sin(clock.elapsedTime*2)*.03;
  body.position.y=1.05+bob;head.position.y=2.35+bob;head.rotation.z=moving?Math.sin(walkT)*.06:0;
  feet[0].position.z=.05+Math.sin(walkT)*.3;feet[1].position.z=.05-Math.sin(walkT)*.3;arms[0].rotation.x=Math.sin(walkT)*.6;arms[1].rotation.x=-Math.sin(walkT)*.6;
  shadowBlob.position.set(hero.position.x,.03,hero.position.z);
  // 가까운 문
  let best=null,bd=3.2;for(const b of B){const d=Math.hypot(hero.position.x-b.door.x,hero.position.z-b.door.z);if(d<bd){bd=d;best=b;}}
  if(best!==near){near=best;if(near&&!roomOpen){prompt.innerHTML=`${near.emoji} ${near.name} 들어가기<kbd>E</kbd>`;prompt.style.display='block';}else prompt.style.display='none';}
  // 카메라
  camPos.copy(hero.position).add(camOff);camera.position.lerp(camPos,1-Math.pow(.001,dt));look.copy(hero.position).add(new THREE.Vector3(0,1.5,0));camera.lookAt(look);
  water.position.y=.95+Math.sin(clock.elapsedTime*2)*.03;sea.material.color.setHSL(.53,.58,.70+Math.sin(clock.elapsedTime*.6)*.015);
  renderer.render(scene,camera);drawMini();requestAnimationFrame(step);}
// 화면 비율에 맞춰 카메라 거리 조절: 세로로 긴 휴대폰 화면에서도 섬이 넉넉히 보이도록
function resize(){const a=innerWidth/innerHeight;renderer.setSize(innerWidth,innerHeight,false);camera.aspect=a;
  const portrait=a<1;camera.fov=portrait?46:34;
  // 데스크톱에서 보이는 가로 폭(약 36)의 75% 이상이 보이게 거리 배율 계산
  const hTan=Math.tan(camera.fov*Math.PI/360)*a,want=a>=1.2?36:28,phone=matchMedia('(pointer:coarse)').matches||innerWidth<800||innerHeight<500,
    k=Math.max(1,Math.min(2.4,want/(2*39*hTan)))*(innerHeight<500?1.3:1)*(phone?2:1);  // 휴대폰은 절반 크기로 보이게 2배 거리
  camOff.set(0,30*k,25*k);scene.fog.near=60+40*(k-1);scene.fog.far=150+90*(k-1);camera.far=300+150*(k-1);camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
camera.position.copy(hero.position).add(camOff);
window.__island={hero,B,openRoom};
document.getElementById('loading').classList.add('hide');requestAnimationFrame(step);
}
// 간판 글꼴(Jua)을 먼저 받고 섬을 그림 (최대 2초 대기)
const fontReady=document.fonts&&document.fonts.load?document.fonts.load('40px Jua').catch(()=>{}):Promise.resolve();
Promise.race([fontReady,new Promise(r=>setTimeout(r,2000))]).then(init);
})();
</script>
