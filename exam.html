<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>문제 · Just Do it Statistics</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 시험지(왼쪽) + OMR 답안지(오른쪽, sticky). 휴대폰에서는 OMR이 하단 서랍으로 접힘 */
:root{
  --paper:#fbfaf7; --sheet:#ffffff; --ink:#1d2230; --muted:#6a6f7c; --line:#e6e2da;
  --omr:#d2475a; --omr-soft:#fbe9ec; --omr-line:#f0c3cb;
  --mark:#1d2230; --ok:#1f8a5b; --ok-soft:#e3f4ec; --bad:#c43c3c; --bad-soft:#fbe7e7;
  --hl:#fff4c7;
  --f-ui:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-q:"Noto Serif KR","AppleMyungjo","Batang",serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15171d; --sheet:#1d2028; --ink:#e9e7e2; --muted:#9a9fab; --line:#2e323c;
  --omr:#ef7486; --omr-soft:#3a2229; --omr-line:#5a3039;
  --mark:#f1efe9; --ok:#4cc58d; --ok-soft:#183126; --bad:#f07a7a; --bad-soft:#3a1f22; --hl:#3a3420; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15171d; --sheet:#1d2028; --ink:#e9e7e2; --muted:#9a9fab; --line:#2e323c;
  --omr:#ef7486; --omr-soft:#3a2229; --omr-line:#5a3039;
  --mark:#f1efe9; --ok:#4cc58d; --ok-soft:#183126; --bad:#f07a7a; --bad-soft:#3a1f22; --hl:#3a3420; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,label:focus-within{outline:2px solid var(--omr);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--omr);font-weight:600}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:10px 16px;font-weight:600}
.btn:hover{border-color:var(--omr)}
.btn.primary{background:var(--omr);border-color:var(--omr);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- 시작 화면 ---------- */
#setup{display:grid;gap:28px;max-width:860px;margin:0 auto}
.hero{display:grid;gap:10px;padding-top:8px}
.hero h1{font-family:var(--f-q);font-size:clamp(28px,5vw,40px);font-weight:700;line-height:1.25}
.hero p{color:var(--muted);margin:0;max-width:60ch}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:16px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel-head h2{font-size:17px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.chip{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--paper);min-width:0}
.chip input{accent-color:var(--omr);width:18px;height:18px;flex:none}
.chip .cn{font-family:var(--f-num);color:var(--omr);font-weight:600;width:2.2em;flex:none}
.chip .ct{flex:1;min-width:0;font-size:14px;line-height:1.35}
.chip .cc{font-size:12px;color:var(--muted);flex:none}
.chip:has(input:checked){border-color:var(--omr);background:var(--omr-soft)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.mode{border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;display:grid;gap:2px;background:var(--paper)}
.mode input{position:absolute;opacity:0;pointer-events:none}
.mode b{font-size:15px}
.mode span{font-size:13px;color:var(--muted)}
.mode:has(input:checked){border-color:var(--omr);box-shadow:inset 0 0 0 1px var(--omr);background:var(--omr-soft)}
.optrow{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.optrow label{display:flex;gap:8px;align-items:center;cursor:pointer;font-size:14px}
.optrow input{accent-color:var(--omr)}
.start-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.start-bar .sum{color:var(--muted);font-size:14px}

/* ---------- 시험 화면 ---------- */
#exam{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar .title{font-weight:700;font-size:15px}
.progress{flex:1;min-width:140px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--omr);width:0;transition:width .25s}
.timer{color:var(--muted);font-size:13px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:clamp(18px,3vw,32px);display:grid;gap:18px;min-width:0}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.tag{border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:12px}
.tag.year{border-color:var(--omr-line);color:var(--omr)}
.qtext{font-family:var(--f-q);font-size:clamp(17px,2.2vw,19px);line-height:1.7;font-weight:600;margin:0}
.qtext .qn{font-family:var(--f-num);color:var(--omr);margin-right:.4em}
.box{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:14px 18px;font-family:var(--f-q);font-size:15.5px;display:grid;gap:4px}
.box p{margin:0}
.box.scale p{font-family:var(--f-num);font-size:14px;white-space:pre-wrap}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:12px 14px;font-family:var(--f-q);font-size:16px;line-height:1.55;width:100%}
.opt:hover:not(:disabled){border-color:var(--omr)}
.opt .b{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--omr-line);display:grid;place-items:center;font-family:var(--f-num);font-size:13px;color:var(--omr);margin-top:1px}
.opt.sel{border-color:var(--mark);box-shadow:inset 0 0 0 1px var(--mark)}
.opt.sel .b{background:var(--mark);border-color:var(--mark);color:var(--sheet)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft);box-shadow:none}
.opt.correct .b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:none}
.opt.wrong .b{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default;opacity:1}
.exp{border-left:3px solid var(--ok);background:var(--paper);padding:12px 16px;border-radius:0 8px 8px 0;font-size:14.5px}
.exp.bad{border-left-color:var(--bad)}
.exp b{display:block;margin-bottom:2px}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.nav .mid{display:flex;gap:8px;align-items:center}
.flag.on{background:var(--hl);border-color:#d8b24a}
.kbd{font-size:12px;color:var(--muted)}

/* OMR 답안지 */
.omr{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--sheet);border:1.5px solid var(--omr-line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
.omr-head{background:var(--omr);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.omr-head b{letter-spacing:.06em;font-size:14px}
.omr-head span{font-size:12px;opacity:.9}
.omr-body{overflow:auto;padding:6px 10px 10px}
.omr-ch{font-size:12px;color:var(--omr);font-weight:600;padding:8px 4px 4px;border-bottom:1px solid var(--omr-line);margin-bottom:2px;position:sticky;top:-6px;background:var(--sheet)}
.omr-row{display:grid;grid-template-columns:44px repeat(5,1fr);align-items:center;gap:2px;padding:2px 0;border-radius:6px}
.omr-row.cur{background:var(--omr-soft)}
.omr-row .rn{font-family:var(--f-num);font-size:12px;color:var(--omr);text-align:left;padding-left:4px;background:none;border:0;border-radius:4px}
.omr-row .rn.flagged{background:var(--hl);color:var(--ink)}
.bub{width:22px;height:22px;justify-self:center;border-radius:50%;border:1.3px solid var(--omr-line);background:transparent;font-family:var(--f-num);font-size:10px;color:var(--omr);display:grid;place-items:center;padding:0;line-height:1}
.bub:hover{border-color:var(--omr)}
.bub.on{background:var(--mark);border-color:var(--mark);color:transparent}
.bub.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.bub.no{background:var(--bad);border-color:var(--bad);color:#fff}
.bub.ans{box-shadow:0 0 0 2px var(--ok)}
.omr-foot{border-top:1px solid var(--omr-line);padding:10px;display:grid;gap:8px}
.omr-foot .stat{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.omr-toggle{display:none}

/* 확인 대화 */
.dialog{position:fixed;inset:0;background:rgba(10,12,18,.45);display:grid;place-items:center;padding:16px;z-index:50}
.dialog .card{background:var(--sheet);border-radius:12px;padding:22px;max-width:420px;width:100%;display:grid;gap:14px;border:1px solid var(--line)}
.dialog .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* ---------- 결과 화면 ---------- */
#result{display:grid;gap:24px;max-width:960px;margin:0 auto}
.score{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:24px}
.ring{width:150px;height:150px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .v b{font-family:var(--f-num);font-size:34px;line-height:1}
.ring .v span{font-size:12px;color:var(--muted)}
.score h2{font-family:var(--f-q);font-size:24px;margin-bottom:6px}
.score p{margin:0;color:var(--muted)}
.score .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chbars{display:grid;gap:8px}
.chbar{display:grid;grid-template-columns:minmax(0,220px) 1fr 64px;gap:12px;align-items:center;font-size:14px}
.chbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chbar .tr{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.chbar .tr i{display:block;height:100%;border-radius:5px}
.chbar .pc{text-align:right}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 14px;font-size:14px}
.filters button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.review{display:grid;gap:14px}
.rv{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:14px}
.rv-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.verdict{font-weight:700;font-size:13px;padding:2px 10px;border-radius:999px}
.verdict.o{background:var(--ok-soft);color:var(--ok)}
.verdict.x{background:var(--bad-soft);color:var(--bad)}
.verdict.n{background:var(--line);color:var(--muted)}
.rv .opt{font-size:15px;padding:9px 12px}
.rv .yours{font-size:12px;color:var(--bad);font-family:var(--f-ui);font-weight:600;margin-left:auto;flex:none;padding-left:8px}
.empty{color:var(--muted);text-align:center;padding:30px}

@media (max-width:900px){
  #exam{grid-template-columns:minmax(0,1fr)}
  .omr{position:fixed;left:0;right:0;bottom:0;top:auto;border-radius:14px 14px 0 0;max-height:70vh;z-index:40;transform:translateY(calc(100% - 52px - env(safe-area-inset-bottom,0px)));transition:transform .25s;padding-bottom:env(safe-area-inset-bottom,0px);
    margin-left:0;margin-right:0}
  .omr.open{transform:none}
  .omr-head{cursor:pointer;min-height:52px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  .omr-toggle{display:inline}
  .score{grid-template-columns:1fr;justify-items:center;text-align:center}
  .score .acts{justify-content:center}
  .chbar{grid-template-columns:minmax(0,1fr) 80px 52px}
}

/* ---------- 장 목록 · 비밀번호 · 학생 정보 (Just Do it Statistics) ---------- */
.topnav{display:flex;justify-content:flex-start}
.topnav .btn{text-decoration:none;color:var(--ink)}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.chcard{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:16px 18px;min-height:96px}
.chcard:hover{border-color:var(--omr);background:var(--omr-soft)}
.chcard .no{grid-row:span 2;font-family:var(--f-num);font-size:26px;font-weight:600;color:var(--omr);min-width:2.4em}
.chcard .tt{font-weight:600;font-size:15px;line-height:1.35}
.chcard .mt{font-size:13px;color:var(--muted)}
.chcard .lk{grid-row:span 2;font-size:18px}
.chcard.done .lk::after{content:" ✓";color:var(--ok);font-size:14px}
.fields{display:grid;gap:10px}
.fld{display:grid;gap:6px;font-size:14px;color:var(--muted)}
.fld input{font:inherit;font-size:18px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.fld input:focus{outline:2px solid var(--omr);outline-offset:1px}
#pw{letter-spacing:.5em;font-family:var(--f-num);text-align:center}
.gerr{margin:0;color:var(--bad);font-size:14px}
.who{font-size:13px;color:var(--muted)}
.send{border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:16px 20px;font-size:15px}
.send.ok{border-color:var(--ok);background:var(--ok-soft)}
.send.bad{border-color:var(--bad);background:var(--bad-soft)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <!-- 시작 -->
  <section id="setup">
    <div class="topnav"><a class="btn ghost" href="index.html">← 통계 화면</a></div>
    <div class="hero"><h1>문제</h1><p>풀 장을 누르고 비밀번호를 입력하세요.</p></div>
    <div class="chgrid" id="chips"></div>
  </section>

  <!-- 시험 -->
  <section id="exam" hidden>
    <div class="topbar">
      <button class="btn ghost" id="quitBtn" type="button">← 장 목록</button>
      <span class="title" id="examTitle"></span>
      <div class="progress" aria-hidden="true"><i id="prog"></i></div>
      <span class="who" id="who"></span><span class="timer num" id="timer">00:00</span>
    </div>
    <article class="sheet" id="sheet" aria-live="polite"></article>
    <aside class="omr" id="omr">
      <div class="omr-head" id="omrHead"><b>OMR 답안지</b><span><span id="omrCount" class="num"></span> <span class="omr-toggle">▲</span></span></div>
      <div class="omr-body" id="omrBody"></div>
      <div class="omr-foot">
        <div class="stat"><span>표시한 문항 <b id="flagCount" class="num">0</b></span><span>안 푼 문항 <b id="leftCount" class="num">0</b></span></div>
        <button class="btn primary" id="submitBtn" type="button">답안 제출하고 채점</button>
      </div>
    </aside>
  </section>

  <!-- 결과 -->
  <section id="result" hidden>
    <div class="score">
      <div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="10"/><circle id="ringArc" cx="60" cy="60" r="52" fill="none" stroke="var(--omr)" stroke-width="10" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg>
        <div class="v"><div><b id="scorePct">0</b><br><span>점 (100점 환산)</span></div></div></div>
      <div>
        <h2 id="scoreHead"></h2>
        <p id="scoreSub"></p>
        <div class="acts">
          <button class="btn" id="resend" type="button" hidden>다시 전송</button>
          <button class="btn ghost" id="csvBtn" type="button">결과 파일 받기 (CSV)</button>
          <button class="btn primary" id="toSetup" type="button">장 목록으로</button>
        </div>
      </div>
    </div>
    <div class="send" id="sendState"></div>
    <div class="panel" id="chpanel" hidden><div class="panel-head"><h2>장별 정답률</h2></div><div class="chbars" id="chbars"></div></div>
    <div id="reviewWrap" hidden><div class="panel-head"><h2>정답 확인 · 해설</h2>
      <div class="filters" id="filters">
        <button type="button" data-f="all" class="on">전체</button>
        <button type="button" data-f="x">틀린 문제</button>
        <button type="button" data-f="n">안 푼 문제</button>
        <button type="button" data-f="flag">표시한 문제</button>
        <button type="button" data-f="o">맞힌 문제</button>
      </div></div>
    <div class="review" id="review"></div></div>
  </section>
</div>

<div class="dialog" id="gate" hidden><form class="card" role="dialog" aria-modal="true" aria-labelledby="gateT" id="gateForm" autocomplete="off">
  <h3 id="gateT"></h3><p id="gateSub" style="margin:0;color:var(--muted)"></p>
  <div id="stepPw" class="fields"><label class="fld">비밀번호 (숫자 4자리)<input id="pw" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" required></label></div>
  <div id="stepInfo" class="fields" hidden><label class="fld">학번<input id="sid" inputmode="numeric" maxlength="20" required></label><label class="fld">이름<input id="sname" maxlength="20" required></label></div>
  <p class="gerr" id="gateErr" hidden></p>
  <div class="row"><button class="btn" id="gateNo" type="button">취소</button><button class="btn primary" id="gateYes" type="submit">확인</button></div>
</form></div>
<div class="dialog" id="dlg" hidden><div class="card" role="dialog" aria-modal="true" aria-labelledby="dlgT">
  <h3 id="dlgT">답안을 제출할까요?</h3><p id="dlgP" style="margin:0;color:var(--muted)"></p>
  <div class="row"><button class="btn" id="dlgNo" type="button">계속 풀기</button><button class="btn primary" id="dlgYes" type="button">제출하고 채점</button></div>

<script>

 "ans": 3, "exp": "실직 기간이 영향을 주는 독립변수, 우울이 종속변수이며, 그 관계를 달라지게 하는 가족 지지는 조절변수다."}, {"id": "4-5", "year": "2015", "q": "방과후 학습 프로그램이 다문화가정 아동의 학업성취에 미치는 영향을 평가할 때, 학업성취의 차이를 가져올 수 있는 부모의 학력은 무엇에 해당하는가?", "box": [], "opts": ["산출변수", "외생변수", "투입변수", "종속변수", "전환변수"], "ans": 2, "exp": "프로그램(독립변수) 외에 종속변수(학업성취)에 영향을 줄 수 있는 변수는 외생변수다."}, {"id": "4-6", "year": "2020", "q": "\"직장 내 괴롭힘이 근로자의 불안에 미치는 영향은 동료 지지의 수준에 따라 달라진다.\" 이 연구에 존재하지 않는 변수는?", "box": [], "opts": ["독립변수", "매개변수", "종속변수", "조절변수", "내생변수"], "ans": 2, "exp": "괴롭힘(독립), 불안(종속, 모형 안에서 설명되므로 내생변수), 동료 지지(조절)는 있지만 경로를 전달하는 매개변수는 없다."}, {"id": "4-7", "year": "2024", "q": "변수에 관한 설명으로 옳지 않은 것은?", "box": [], "opts": ["매개변수는 독립변수의 영향을 받아 종속변수에 영향을 준다.", "통제변수는 독립변수와 종속변수의 관계에 영향을 줄 수 있어 통제 대상이 된다.", "독립변수는 결과변수이고, 종속변수는 설명변수이다.", "조절변수는 독립변수와 종속변수 관계의 강도에 영향을 줄 수 있다.", "변수 간 관계는 곡선 형태로도 나타날 수 있다."], "ans": 3, "exp": "독립변수가 설명(원인)변수이고 종속변수가 결과변수다."}, {"id": "4-8", "year": "2025", "q": "개념적 정의와 조작적 정의에 관한 설명으로 옳은 것은?", "box": [], "opts": ["조작적 정의는 개념적 정의보다 주관적 해석의 여지가 적다.", "조작적 정의는 양적조사보다 질적조사에서 더 중요하다.", "조작적 정의를 통해 개념의 의미가 확장된다.", "조작적 정의 → 개념적 정의 → 측정 순으로 진행된다.", "개념적 정의만으로 변수를 직접 측정할 수 있다."], "ans": 1, "exp": "② 양적조사에서 더 중요하다. ③ 의미를 구체화할 뿐 확장하지 않는다. ④ 개념적 정의 → 조작적 정의 → 측정 순이다. ⑤ 개념적 정의는 추상적이어서 직접 측정할 수 없다."}]}, {"no": 5, "title": "측정", "qs": [{"id": "5-1", "year": "2015", "q": "설문지에 월평균 가구소득을 원 단위로 직접 적게 했다. 이 변수에 관한 설명으로 옳지 않은 것은?", "box": [], "opts": ["100만 원과 110만 원의 차이는 500만 원과 510만 원의 차이와 같다.", "0원은 소득이 전혀 없음을 뜻하는 절대영점이다.", "표준편차를 계산할 수 없다.", "사칙연산이 가능하다.", "명목척도로 바꿀 수 있다."], "ans": 3, "exp": "원 단위로 직접 적은 소득은 비율변수이므로 모든 연산이 가능하고 표준편차도 계산할 수 있다. 높은 수준의 변수는 낮은 수준(예: 소득 유무)으로 바꿀 수 있다."}, {"id": "5-2", "year": "2017", "q": "변수의 측정수준에 관한 설명으로 옳은 것은?", "box": [], "opts": ["혈액형은 서열척도이다.", "종교는 등간척도이다.", "반 석차로 평가한 성적은 등간척도이다.", "5점 척도로 측정한 서비스 만족도 한 문항은 비율척도이다.", "지능지수(IQ)와 섭씨온도는 등간척도이다."], "ans": 5, "exp": "① 명목, ② 명목, ③ 서열, ④ 서열이다."}, {"id": "5-3", "year": "2019", "q": "측정수준 – 사례 – 가능한 통계의 연결로 옳지 않은 것은?", "box": [], "opts": ["명목 – 기초생활수급 여부 – 백분율", "서열 – 학점(A, B, C…) – 최빈값", "등간 – 섭씨온도 – 중위수", "비율 – 사회복지사 시험점수(0~100점) – 산술평균", "명목 – 성별, 현재 음주 여부 – 교차분석"], "ans": 4, "exp": "시험점수의 0점은 실력이 전혀 없음을 뜻하지 않으므로 등간수준이다. 통계 연결 자체는 모두 옳다."}, {"id": "5-4", "year": "2024", "q": "측정수준이 서로 다른 변수로 묶인 것은?", "box": [], "opts": ["거주 지역, 장애 등록 여부", "출산율 증가율, 월평균 근로시간", "화씨온도, 지능지수", "건강상태(좋음·보통·나쁨), 혈액형", "성별, 기초연금 수급 여부"], "ans": 4, "exp": "건강상태(좋음·보통·나쁨)는 서열, 혈액형은 명목이다. 나머지는 각각 명목-명목, 비율-비율, 등간-등간, 명목-명목이다."}, {"id": "5-5", "year": "2024", "q": "척도의 종류가 바르게 짝지어진 것은?", "box": ["ㄱ. 거주형태: 자가, 전세, 월세, 기타", "ㄴ. 근속연수: 현 기관에서 근무한 기간(년)", "ㄷ. 서비스 등급: 1등급, 2등급, 3등급"], "opts": ["ㄱ: 명목, ㄴ: 서열, ㄷ: 비율", "ㄱ: 명목, ㄴ: 비율, ㄷ: 서열", "ㄱ: 비율, ㄴ: 등간, ㄷ: 서열", "ㄱ: 서열, ㄴ: 등간, ㄷ: 비율", "ㄱ: 서열, ㄴ: 비율, ㄷ: 명목"], "ans": 2, "exp": "거주형태는 단순 분류이므로 명목, 근속연수는 0년이 '근무 기간 없음'을 뜻하므로 비율, 등급은 순서가 있으므로 서열이다."}, {"id": "5-6", "year": "2013", "q": "리커트 척도에 관한 설명으로 옳은 것은?", "box": [], "opts": ["비율척도이다.", "문항마다 중요도를 다르게 부여한다.", "단일 문항으로 측정하는 것이 장점이다.", "질적조사에서 주로 사용된다.", "척도 구성이 쉬워 척도나 지수 개발에 용이하다."], "ans": 5, "exp": "① 서열척도다. ② 모든 문항을 동등하게 본다. ③ 여러 문항으로 측정한다. ④ 양적조사에서 주로 쓰인다."}, {"id": "5-7", "year": "2019", "q": "다음 설명에 해당하는 척도는?", "box": ["연구팀은 노인 학대에 대한 인식 문항 120개를 만들어 평가자 30명에게 각 문항의 강도를 0~10점으로 분류하게 했다. 평가자 간 판단 차이가 큰 문항은 버리고, 남은 문항은 평가 점수의 중위수를 가중치로 삼았다."], "opts": ["거트만 척도", "서스톤 척도", "리커트 척도", "보가더스 척도", "의미분화 척도"], "ans": 2, "exp": "평가자, 11점 분류, 중위수 가중치는 서스톤 척도의 특징이다."}, {"id": "5-8", "year": "2021", "q": "다음 문항에 사용된 척도는?", "box": ["지역아동센터에 대해 느끼는 정도에 표시하시오.", "따뜻한 1 - 2 - 3 - 4 - 5 - 6 - 7 차가운", "활기찬 1 - 2 - 3 - 4 - 5 - 6 - 7 침체된"], "opts": ["리커트 척도", "거트만 척도", "보가더스 척도", "의미분화 척도", "서스톤 척도"], "ans": 4, "exp": "양 끝에 서로 반대되는 형용사를 놓는 형태는 의미분화(어의적 분화) 척도다."}, {"id": "5-9", "year": "2024", "q": "측정에 관한 설명으로 옳지 않은 것은?", "box": [], "opts": ["측정은 대상의 속성에 일정한 규칙에 따라 숫자나 기호를 부여하는 과정이다.", "사회과학에서는 개념을 지표로 간접 측정하는 경우가 많다.", "보가더스의 사회적 거리 척도는 등간척도의 한 종류이다.", "리커트 척도는 문항 점수를 합산해 전체 경향을 측정한다.", "측정 문항 수를 늘리면 신뢰도가 높아지는 경향이 있다."], "ans": 3, "exp": "보가더스 척도는 거트만 방식의 누적척도로 서열척도에 속한다. 등간에 가까운 것은 서스톤 척도다."}, {"id": "5-10", "year": "2021", "q": "측정에 관한 설명으로 옳지 않은 것은?", "box": [], "opts": ["일정한 규칙에 따라 대상에 값을 부여하는 과정이다.", "이론적 개념과 경험적 현상을 연결한다.", "현상을 세분화하고 통계 분석에 쓸 정보를 제공한다.", "신뢰도를 높이려면 문항 수를 줄여야 한다.", "명목, 서열, 등간, 비율의 네 수준으로 나눈다."], "ans": 4, "exp": "문항 수가 많을수록 신뢰도는 높아지는 경향이 있다."}]}, {"no": 6, "title": "측정의 타당도와 신뢰도", "qs": [{"id": "6-1", "year": "2012", "q": "같은 대상에게 같은 측정도구를 시점만 달리하여 실시하고 두 결과를 비교하는 신뢰도 측정법은?", "box": [], "opts": ["검사-재검사법", "평행양식법", "반분법", "복수양식법", "내적 일관성법"], "ans": 1, "exp": "시점을 달리해 같은 도구로 두 번 측정하는 것은 검사-재검사법이다. ②와 ④는 같은 방법이므로 답이 될 수 없고, ③은 ⑤에 속한다."}, {"id": "6-2", "year": "2012", "q": "다음 (   ) 안에 알맞은 것은?", "box": ["사회복지관 채용 필기시험에서 A는 높은 점수를, B는 낮은 점수를 받았지만 둘 다 입사했다. 1년 뒤 B의 업무성과가 A보다 훨씬 뛰어났다면, 이 시험의 (     )타당도는 낮았다고 볼 수 있다"], "opts": ["내용", "동시", "수렴", "판별", "예측"], "ans": 5, "exp": "현재 점수가 미래의 성과를 얼마나 잘 예측하는가는 예측타당도다."}, {"id": "6-3", "year": "2015", "q": "30문항 척도를 15문항씩 두 묶음으로 나누어 두 점수의 상관으로 일관성을 확인하였다. 이에 관한 설명으로 옳지 않은 것은?", "box": [], "opts": ["신뢰도 측정방법의 하나이다.", "두 번 조사해야 하는 불편이 없다.", "30문항이 같은 개념을 측정할 때 적용할 수 있다.", "문항을 어떻게 나누느냐에 따라 상관이 달라진다.", "상관이 낮으면 어떤 문항을 빼야 하는지 알 수 있다."], "ans": 5, "exp": "반분법은 어떤 문항이 문제인지 알려 주지 않는다. 문항 제거 시 신뢰도 변화를 알 수 있는 것은 크론바흐 알파다."}, {"id": "6-4", "year": "2017", "q": "다음에서 사용한 타당도는?", "box": ["새로 개발한 청소년 스마트폰 과의존 척도의 점수를, 이미 널리 쓰이고 타당성이 검증된 과의존 척도의 점수와 같은 시기에 함께 측정해 비교하였다."], "opts": ["내용타당도", "동시타당도", "예측타당도", "요인타당도", "판별타당도"], "ans": 2, "exp": "같은 시점에 기존 검증 도구를 기준으로 비교하는 것은 기준타당도 중 동시타당도다."}, {"id": "6-5", "year": "2017", "q": "아동의 신장을 측정했는데 측정기가 항상 실제보다 2cm 크게 측정되었다. 이 측정에 관한 설명으로 옳은 것은?", "box": [], "opts": ["타당도는 높지만 신뢰도는 낮다.", "신뢰도는 높지만 타당도는 낮다.", "신뢰도와 타당도가 모두 높다.", "신뢰도와 타당도가 모두 낮다.", "신뢰도와 타당도를 판단할 수 없다."], "ans": 2, "exp": "항상 같은 방향, 같은 크기로 틀리므로 일관성(신뢰도)은 높고 정확성(타당도)은 낮다. 체계적 오류의 전형적인 예다."}, {"id": "6-6", "year": "2019", "q": "측정도구의 신뢰도에 관한 설명으로 옳은 것은?", "box": [], "opts": ["일관성 또는 안정성으로 표현할 수 있는 개념이다.", "측정도구가 개념의 실질적 의미를 반영하는 정도와 관련된다.", "검사-재검사 신뢰도가 가장 널리 사용된다.", "사회적 바람직성 편향은 신뢰도를 떨어뜨리는 주된 요인이다.", "문항 수가 많을수록 신뢰도는 낮아진다."], "ans": 1, "exp": "②는 타당도다. ③ 가장 널리 쓰이는 것은 크론바흐 알파다. ④ 사회적 바람직성 편향은 체계적 오류로 타당도를 떨어뜨린다. ⑤ 문항 수가 많을수록 신뢰도는 높아진다."}, {"id": "6-7", "year": "2021", "q": "다음 사례에서 확인하려는 타당도는?", "box": ["연구자는 새로 개발한 사회적 고립 척도의 타당도를 확인하기 위해 신체활동량 척도와의 상관을 구했고, 상관이 매우 낮음을 확인하였다."], "opts": ["동시타당도", "판별타당도", "내용타당도", "수렴타당도", "예측타당도"], "ans": 2, "exp": "서로 다른 개념을 재는 척도 간 상관이 낮아야 한다는 것은 판별타당도다."}, {"id": "6-8", "year": "2024", "q": "내적 일관성에 근거한 신뢰도 측정방법을 모두 고른 것은?", "box": ["ㄱ. 검사-재검사법", "ㄴ. 관찰자 간 신뢰도", "ㄷ. 크론바흐 알파", "ㄹ. 대안법"], "opts": ["ㄱ", "ㄷ", "ㄴ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ"], "ans": 2, "exp": "내적 일관성 방법은 반분법과 크론바흐 알파다. 보기 중에는 ㄷ만 해당한다."}, {"id": "6-9", "year": "2024", "q": "신뢰도와 타당도에 관한 설명으로 옳은 것은?", "box": [], "opts": ["타당도가 있다면 어느 정도 신뢰도가 있다고 볼 수 있다.", "신뢰도가 높으면 타당도도 높다.", "요인분석은 신뢰도를 측정하는 방법이다.", "신뢰도는 측정하려는 개념을 얼마나 정확하게 측정하는가를 나타낸다.", "전문가들이 척도가 측정 내용을 담고 있다고 판단하면 판별타당도가 있다고 한다."], "ans": 1, "exp": "② 신뢰도가 높아도 타당도는 낮을 수 있다. ③ 요인분석은 타당도 검증 방법이다. ④는 타당도의 정의다. ⑤는 내용타당도다."}, {"id": "6-10", "year": "2025", "q": "측정도구의 타당도와 신뢰도에 관한 설명으로 옳지 않은 것은?", "box": [], "opts": ["신뢰도는 측정값의 일관성 정도를 뜻한다.", "타당도는 측정하려는 바를 반영하는 정도를 뜻한다.", "측정 항목 수가 적어지면 신뢰도가 낮아지는 경향이 있다.", "신뢰도는 타당도의 필요충분조건이다.", "타당도가 높으면 신뢰도도 높은 경우가 많다."], "ans": 4, "exp": "신뢰도는 타당도의 필요조건이지만 충분조건은 아니다."}, {"id": "6-11", "year": "2017", "q": "측정오류에 관한 설명으로 옳은 것은?", "box": [], "opts": ["편향은 체계적 오류를 일으킨다.", "무작위 오류는 측정의 타당도를 떨어뜨린다.", "체계적 오류는 측정의 신뢰도를 떨어뜨린다.", "표준화된 측정도구를 써도 체계적 오류는 줄일 수 없다.", "측정자나 대상자의 일관성 부족으로 생기는 오류는 체계적 오류이다."], "ans": 1, "exp": "② 무작위 오류는 신뢰도를, ③ 체계적 오류는 타당도를 떨어뜨린다. ④ 표준화된 도구는 체계적 오류를 줄인다. ⑤는 무작위 오류다."}, {"id": "6-12", "year": "2020", "q": "체계적 오류에 관한 설명으로 옳지 않은 것은?", "box": [], "opts": ["자료 입력 과정의 코딩 실수는 체계적 오류를 일으킨다.", "익명 응답은 체계적 오류를 줄인다.", "편견 없는 단어를 쓰면 체계적 오류가 줄어든다.", "척도 구성 과정의 실수는 체계적 오류를 일으킨다.", "비관여적 관찰은 체계적 오류를 줄인다."], "ans": 1, "exp": "코딩 실수는 일정한 방향 없이 생기는 무작위(비체계적) 오류다."}]}, {"no": 7, "title": "표집", "qs": [{"id": "7-1", "yea   S={ch:gateCh,sid,name,order:ids,ans:{},flag:{},idx:0,mode:"exam",start:Date.now(),elapsed:0,done:false};save();showExam();};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){["setup","exam","result"].forEach(s=>$("#"+s).hidden=s!==id);window.scrollTo(0,0)}

/* ---------- 시험 화면 ---------- */
function showExam(){
  show("exam");
  $("#examTitle").textContent=`${S.ch}장 ${DATA.find(c=>c.no===S.ch).title}`;$("#who").textContent=`${S.sid} ${S.name}`;
  $("#submitBtn").textContent=S.mode==="study"?"결과 보기":"답안 제출하고 채점";
  buildOMR(); render();
  S.start=Date.now()-(S.elapsed||0)*1000;
  clearInterval(timerId); timerId=setInterval(tick,1000); tick();
}
function tick(){S.elapsed=Math.floor((Date.now()-S.start)/1000);const m=Math.floor(S.elapsed/60),s=S.elapsed%60;$("#timer").textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;if(S.elapsed%10===0)save()}
function render(){
  const id=S.order[S.idx], q=Q[id], a=S.ans[id], reveal=S.mode==="study"&&a!=null;
  const ch=DATA.find(c=>c.no===q.ch);
  const isScale=q.box.some(b=>/1 - 2/.test(b));
  let h=`<div class="qmeta"><span class="num">${S.idx+1} / ${S.order.length}</span><span class="tag">${q.ch}장 ${esc(ch.title)}</span>${q.year?`<span class="tag year">${q.year}년 기출 유형</span>`:""}</div>
  <p class="qtext"><span class="qn">${id}</span>${esc(q.q)}</p>`;
  if(q.box.length) h+=`<div class="box${isScale?" scale":""}">${q.box.map(b=>`<p>${esc(b)}</p>`).join("")}</div>`;
  h+=`<div class="opts" role="radiogroup" aria-label="보기">`+q.opts.map((o,i)=>{
    const n=i+1; let cls="opt";
    if(reveal){ if(n===q.ans) cls+=" correct"; else if(n===a) cls+=" wrong"; }
    else if(n===a) cls+=" sel";
    return `<button type="button" class="${cls}" data-n="${n}" role="radio" aria-checked="${n===a}" ${reveal?"disabled":""}><span class="b">${n}</span><span>${esc(o)}</span></button>`}).join("")+`</div>`;
  if(reveal){const ok=a===q.ans;h+=`<div class="exp${ok?"":" bad"}"><b style="color:var(${ok?"--ok":"--bad"})">${ok?"정답입니다":"오답입니다"} · 정답 ${C[q.ans-1]}</b>${esc(q.exp)}</div>`}
  h+=`<div class="nav"><button class="btn" id="pv" type="button" ${S.idx?"":"disabled"}>← 이전</button>
    <div class="mid"><button class="btn flag ${S.flag[id]?"on":""}" id="fg" type="button">${S.flag[id]?"★ 표시됨":"☆ 나중에 다시 보기"}</button></div>
    ${S.idx<S.order.length-1?`<button class="btn primary" id="nx" type="button">다음 →</button>`:`<button class="btn primary" id="fin" type="button">${S.mode==="study"?"결과 보기":"제출하기"}</button>`}</div>
    <div class="kbd">키보드: 1–5 보기 선택 · ← → 이동 · F 표시</div>`;
  $("#sheet").innerHTML=h;
  $("#sheet").querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  $("#pv").onclick=()=>go(-1); if($("#nx"))$("#nx").onclick=()=>go(1); if($("#fin"))$("#fin").onclick=askSubmit;
  $("#fg").onclick=toggleFlag;
  updOMR();
}
function choose(n){
  const id=S.order[S.idx];
  if(S.mode==="study"&&S.ans[id]!=null) return;
  if(S.mode==="exam"&&S.ans[id]===n) delete S.ans[id]; else S.ans[id]=n;
  save(); render();
  if(S.mode==="exam"&&S.ans[id]!=null&&S.idx<S.order.length-1) setTimeout(()=>{if(S.order[S.idx]===id) go(1)},260);
}
function go(d){const n=S.idx+d;if(n<0||n>=S.order.length)return;S.idx=n;save();render();
  if(window.innerWidth<=900) $("#sheet").scrollIntoView({block:"start",behavior:"smooth"})}
function toggleFlag(){const id=S.order[S.idx];if(S.flag[id])delete S.flag[id];else S.flag[id]=1;save();render()}
function buildOMR(){
  let h="",last=null;
  S.order.forEach((id,i)=>{const q=Q[id];
    if(q.ch!==last){last=q.ch;const c=DATA.find(c=>c.no===q.ch);h+=`<div class="omr-ch">${q.ch}장 ${esc(c.title)}</div>`}
    h+=`<div class="omr-row" data-i="${i}"><button type="button" class="rn" data-go="${i}" aria-label="${id}번으로 이동">${id}</button>${[1,2,3,4,5].map(n=>`<button type="button" class="bub" data-i="${i}" data-n="${n}" aria-label="${id}번 ${n}번 마킹">${n}</button>`).join("")}</div>`});
  $("#omrBody").innerHTML=h;
  $("#omrBody").onclick=e=>{const t=e.target.closest("button");if(!t)return;
    const i=+(t.dataset.go??t.dataset.i);S.idx=i;
    if(t.dataset.n){const id=S.order[i];if(S.mode==="study"&&S.ans[id]!=null){}else if(S.ans[id]===+t.dataset.n&&S.mode==="exam")delete S.ans[id];else S.ans[id]=+t.dataset.n;save()}
    render()};
}
function updOMR(){
  const rows=$("#omrBody").querySelectorAll(".omr-row");
  rows.forEach(r=>{const i=+r.dataset.i,id=S.order[i],a=S.ans[id],q=Q[id];
    r.classList.toggle("cur",i===S.idx);
    r.querySelector(".rn").classList.toggle("flagged",!!S.flag[id]);
    r.querySelectorAll(".bub").forEach(b=>{const n=+b.dataset.n;
      b.className="bub";
      if(S.mode==="study"&&a!=null){ if(n===a) b.classList.add(a===q.ans?"ok":"no"); else if(n===q.ans) b.classList.add("ans"); }
      else if(n===a) b.classList.add("on");
    })});
  const done=Object.keys(S.ans).length;
  $("#omrCount").textContent=`${done}/${S.order.length}`;
  $("#leftCount").textContent=S.order.length-done;
  $("#flagCount").textContent=Object.keys(S.flag).length;
  $("#prog").style.width=(done/S.order.length*100)+"%";
  const cur=$("#omrBody").querySelector(".omr-row.cur"); if(cur){const b=$("#omrBody");const t=cur.offsetTop-b.clientHeight/2;if(cur.offsetTop<b.scrollTop+30||cur.offsetTop>b.scrollTop+b.clientHeight-40)b.scrollTop=t}
}
$("#omrHead").onclick=()=>{if(window.innerWidth<=900)$("#omr").classList.toggle("open")};
$("#submitBtn").onclick=askSubmit;
$("#quitBtn").onclick=()=>{clearInterval(timerId);save();renderChips();show("setup")};
function askSubmit(){
  const left=S.order.length-Object.keys(S.ans).length;
  if(S.mode==="study"||left===0){finish();return}
  $("#dlgP").textContent=`아직 풀지 않은 문항이 ${left}개 있습니다. 안 푼 문항은 오답으로 처리됩니다.`;
  $("#dlg").hidden=false;$("#dlgYes").focus();
}
$("#dlgNo").onclick=()=>{$("#dlg").hidden=true;const i=S.order.findIndex(id=>S.ans[id]==null);if(i>=0){S.idx=i;render()}};
$("#dlgYes").onclick=()=>{$("#dlg").hidden=true;finish()};
document.addEventListener("keydown",e=>{
  if(!$("#dlg").hidden){if(e.key==="Escape")$("#dlg").hidden=true;return}
  if($("#exam").hidden||e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^[1-5]$/.test(e.key)){choose(+e.key);e.preventDefault()}
  else if(e.key==="ArrowRight"){go(1);e.preventDefault()}
  else if(e.key==="ArrowLeft"){go(-1);e.preventDefault()}
  else if(e.key==="f"||e.key==="F"){toggleFlag()}
});

/* ---------- 결과 ---------- */
function finish(){clearInterval(timerId);S.done=true;S.submittedAt=new Date().toISOString();S.sent=false;save();
  const d=doneMap();d[S.ch]=1;try{localStorage.setItem(DONE_KEY,JSON.stringify(d))}catch(e){}
  $("#omr").classList.remove("open");showResult();sendResult();}
function payload(){const tot=S.order.length,ok=S.order.filter(id=>S.ans[id]===Q[id].ans).length,none=S.order.filter(id=>S.ans[id]==null).length;
  return {submittedAt:S.submittedAt,chapter:S.ch,chapterTitle:DATA.find(c=>c.no===S.ch).title,studentId:S.sid,name:S.name,
    score:Math.round(ok/tot*100),correct:ok,total:tot,unanswered:none,seconds:S.elapsed,
    wrong:S.order.filter(id=>S.ans[id]!==Q[id].ans).join(", "),answers:S.order.map(id=>`${id}:${S.ans[id]??"-"}`).join(", ")};}
function setSend(cls,html){const el=$("#sendState");el.className="send"+(cls?" "+cls:"");el.innerHTML=html;$("#resend").hidden=cls!=="bad";}
async function sendResult(){
  if(!SHEET_URL){setSend("bad","구글 스프레드시트 주소가 아직 설정되지 않아 결과를 이 기기에만 저장했습니다. 선생님께 알려 주세요. [결과 파일 받기]로 내려받을 수도 있습니다.");$("#resend").hidden=true;return}
  setSend("","결과를 구글 스프레드시트로 보내는 중…");
  const body=JSON.stringify(payload());
  try{const r=await fetch(SHEET_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body});
    const j=await r.json().catch(()=>({ok:r.ok}));if(!j.ok)throw new Error(j.error||"저장 실패");S.sent=true;save();
    setSend("ok",`✓ 제출 완료 · ${S.sid} ${esc(S.name)} · 결과가 구글 스프레드시트에 저장되었습니다.`);}
  catch(e){try{await fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body});S.sent=true;save();
      setSend("ok",`✓ 제출 완료 · ${S.sid} ${esc(S.name)} · 결과를 구글 스프레드시트로 보냈습니다.`);}
    catch(e2){setSend("bad","인터넷 연결 문제로 결과를 보내지 못했습니다. 연결을 확인하고 [다시 전송]을 눌러 주세요. 결과는 이 기기에 저장되어 있습니다.");}}}
$("#resend").onclick=sendResult;
$("#csvBtn").onclick=()=>{const p=payload(),H=["제출시각","장","장 제목","학번","이름","점수","맞힌 문항","전체 문항","안 푼 문항","풀이 시간(초)","틀린 문항","응답"];
  const v=[p.submittedAt,p.chapter,p.chapterTitle,p.studentId,p.name,p.score,p.correct,p.total,p.unanswered,p.seconds,p.wrong,p.answers];
  const q=x=>`"${String(x).replace(/"/g,'""')}"`,csv="﻿"+H.map(q).join(",")+"\n"+v.map(q).join(",")+"\n";
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`${p.chapter}장_${p.studentId}_${p.name}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);};
function showResult(){
  show("result");
  const tot=S.order.length, ok=S.order.filter(id=>S.ans[id]===Q[id].ans).length, none=S.order.filter(id=>S.ans[id]==null).length;
  const pct=Math.round(ok/tot*100);
  $("#scorePct").textContent=pct;
  requestAnimationFrame(()=>{$("#ringArc").style.transition="stroke-dashoffset .9s ease";$("#ringArc").setAttribute("stroke-dashoffset",326.7*(1-ok/tot))});
  $("#scoreHead").textContent=!SHOW_ANSWERS?"답안을 제출했습니다":pct>=80?"아주 잘했습니다":pct>=60?"합격선을 넘었습니다":"틀린 문제를 다시 확인해 보세요";
  const m=Math.floor(S.elapsed/60),s=S.elapsed%60;
  $("#scoreSub").textContent=`${tot}문항 중 ${ok}문항 정답 · 오답 ${tot-ok-none} · 안 푼 문항 ${none} · 풀이 시간 ${m}분 ${s}초`;
  $("#chpanel").hidden=!SHOW_ANSWERS;$("#reviewWrap").hidden=!SHOW_ANSWERS;
  const chs=[...new Set(S.order.map(id=>Q[id].ch))].sort((a,b)=>a-b);
  $("#chbars").innerHTML=chs.map(n=>{const ids=S.order.filter(id=>Q[id].ch===n),o=ids.filter(id=>S.ans[id]===Q[id].ans).length,p=o/ids.length;
    const col=p>=.8?"var(--ok)":p>=.6?"var(--omr)":"var(--bad)";
    return `<div class="chbar"><span class="nm">${n}장 ${esc(DATA.find(c=>c.no===n).title)}</span><span class="tr"><i style="width:${p*100}%;background:${col}"></i></span><span class="pc num">${o}/${ids.length}</span></div>`}).join("");
  filter="all";document.querySelectorAll("#filters button").forEach(b=>b.classList.toggle("on",b.dataset.f==="all"));
  renderReview();
}
function renderReview(){
  const list=S.order.filter(id=>{const a=S.ans[id],q=Q[id];
    return filter==="all"||(filter==="o"&&a===q.ans)||(filter==="x"&&a!=null&&a!==q.ans)||(filter==="n"&&a==null)||(filter==="flag"&&S.flag[id])});
  $("#review").innerHTML=list.length?list.map(id=>{const q=Q[id],a=S.ans[id],v=a==null?"n":a===q.ans?"o":"x";
    return `<div class="rv"><div class="rv-head"><span class="verdict ${v}">${v==="o"?"정답":v==="x"?"오답":"안 풂"}</span><span class="num" style="color:var(--omr);font-weight:600">${id}</span>${q.year?`<span class="tag year">${q.year}년 기출 유형</span>`:""}${S.flag[id]?`<span class="tag">★ 표시</span>`:""}</div>
    <p class="qtext" style="font-size:17px">${esc(q.q)}</p>
    ${q.box.length?`<div class="box${q.box.some(b=>/1 - 2/.test(b))?" scale":""}">${q.box.map(b=>`<p>${esc(b)}</p>`).join("")}</div>`:""}
    <div class="opts">${q.opts.map((o,i)=>{const n=i+1;const cls=n===q.ans?"correct":n===a?"wrong":"";return `<div class="opt ${cls}"><span class="b">${n}</span><span>${esc(o)}</span>${n===a&&n!==q.ans?`<span class="yours">내 답</span>`:""}</div>`}).join("")}</div>
    <div class="exp${v==="o"?"":" bad"}"><b>정답 ${C[q.ans-1]}${a!=null&&a!==q.ans?` · 내 답 ${C[a-1]}`:""}</b>${esc(q.exp)}</div></div>`}).join(""):`<div class="empty">해당하는 문항이 없습니다.</div>`;
}
$("#filters").onclick=e=>{const b=e.target.closest("button");if(!b)return;filter=b.dataset.f;document.querySelectorAll("#filters button").forEach(x=>x.classList.toggle("on",x===b));renderReview()};
$("#toSetup").onclick=()=>{renderChips();show("setup")};
// 보내지 못한 결과가 있으면 다음에 열 때 다시 보냄
{const p=load();if(p&&p.done&&p.sent===false&&SHEET_URL){S=p;sendResult().then(renderChips);}}
</script>

</body></html>
